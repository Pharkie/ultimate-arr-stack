# CI for the template. It cannot reach the NAS, so it does not replace the
# rule in CLAUDE.md that every change is tested there before it reaches main;
# it runs the checks that need no stack, for every contributor, hooks or not.
#
# Blocking — branch protection on main requires these by their exact job
# names, so renaming one silently drops it from the gate:
#   bats suite
#   lint (actionlint, hadolint, shellcheck warnings) — the shellcheck step is advisory
#   supply chain (trivy, sbom)
# Diagnostic — nightly and on manual dispatch, never gate a merge:
#   the trivy scan of every compose image, and the devcontainer build.
#
# Tool images are pinned by tag and digest and bumped by hand; actions are
# pinned by commit SHA and bumped by Renovate (CONTRIBUTING.md, "Pinning policy").
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

# One run per ref: a newer push supersedes the run it replaces. Scheduled runs
# get a group of their own, so a merge to main can't cancel the nightly scan.
concurrency:
  group: ci-${{ github.ref }}${{ github.event_name == 'schedule' && '-nightly' || '' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read

# An explicit shell gets -o pipefail; the implicit default is plain `bash -e`,
# which would let `tests | tee` pass whatever the tests did.
defaults:
  run:
    shell: bash

jobs:
  bats:
    name: bats suite
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true  # bats-core, bats-support and bats-assert are vendored as submodules
      - name: Install the pre-commit hook
        # The suite asserts the hook is installed, as it would be on a
        # contributor's machine.
        run: ./setup-hooks.sh
      - name: Run the suite
        run: ./tests/run-tests.sh --formatter tap tests/*.bats | tee "$RUNNER_TEMP/bats.tap"
      - name: TAP results to the run summary
        if: ${{ !cancelled() }}
        run: |
          tap="$RUNNER_TEMP/bats.tap"
          {
            echo "## bats suite"
            echo
            if [[ -s $tap ]]; then
              ok=$(grep -c '^ok ' "$tap" || true)
              skipped=$(grep -c '^ok .* # skip' "$tap" || true)
              failed=$(grep -c '^not ok ' "$tap" || true)
              echo "$((ok - skipped)) passed, $failed failed, $skipped skipped"
              echo
              echo '```'
              cat "$tap"
              echo '```'
            else
              echo "No TAP output: the suite did not start. The job log says why."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: lint (actionlint, hadolint, shellcheck warnings)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      HADOLINT_IMAGE: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
      SHELLCHECK_IMAGE: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull the tool images (retried — a registry hiccup must not fail a required check)
        run: |
          for img in "$ACTIONLINT_IMAGE" "$HADOLINT_IMAGE" "$SHELLCHECK_IMAGE"; do
            for attempt in 1 2 3 4; do
              docker pull -q "$img" && break
              echo "pull of $img failed (attempt $attempt); retrying in $((attempt * 15))s"
              sleep $((attempt * 15))
            done
            docker image inspect "$img" >/dev/null 2>&1 || { echo "::error::could not pull $img after 4 attempts"; exit 1; }
          done
      - name: actionlint
        # The image bundles shellcheck, so the run: blocks are checked too.
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo "$ACTIONLINT_IMAGE" -color
      - name: hadolint
        # Reads the repo's .hadolint.yaml, which sets the failure threshold
        # and says why the version-pinning rules are off.
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo "$HADOLINT_IMAGE" hadolint --config .hadolint.yaml .devcontainer/Dockerfile
      - name: shellcheck at warning (advisory)
        # The bats suite already fails on shellcheck errors. Warnings are
        # printed and annotated but never fail the job; a shellcheck that
        # could not run at all (exit 2+) does, or the step would go blind.
        run: |
          mapfile -d '' -t scripts < <(git ls-files -z '*.sh')
          rc=0
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt "$SHELLCHECK_IMAGE" -S warning scripts/pre-commit "${scripts[@]}" || rc=$?
          case $rc in
            0) echo "shellcheck: no warnings in scripts/pre-commit and ${#scripts[@]} tracked *.sh files" ;;
            1) echo "::warning title=shellcheck (advisory)::warnings found; see the step log" ;;
            *) echo "::error::shellcheck did not run (exit $rc)"; exit "$rc" ;;
          esac

  supply-chain:
    name: supply chain (trivy, sbom)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYFT_IMAGE: anchore/syft:v1.51.1@sha256:95fe0835e5bebc6f8b1f8acef68d47d63d594ef4c0f25c097ff853b23cbac74c
      TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull the tool images (retried — a registry hiccup must not fail a required check)
        run: |
          for img in "$SYFT_IMAGE" "$TRIVY_IMAGE"; do
            for attempt in 1 2 3 4; do
              docker pull -q "$img" && break
              echo "pull of $img failed (attempt $attempt); retrying in $((attempt * 15))s"
              sleep $((attempt * 15))
            done
            docker image inspect "$img" >/dev/null 2>&1 || { echo "::error::could not pull $img after 4 attempts"; exit 1; }
          done
      - name: Fetch trivy's vulnerability database (retried, same reason)
        run: |
          for attempt in 1 2 3 4; do
            docker run --rm -v trivy-cache:/root/.cache/trivy "$TRIVY_IMAGE" image --download-db-only --no-progress && exit 0
            echo "trivy DB download failed (attempt $attempt); retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "::error::could not download trivy's vulnerability database after 4 attempts"
          exit 1
      - name: Resolve the npm dependencies into a lockfile
        # package-lock.json is gitignored, and without one neither syft nor
        # trivy sees any JavaScript: package.json alone is not a lockfile to
        # them. This writes the lock `npm install` would use today, without
        # installing anything or running any package's scripts.
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: SBOM (syft — SPDX and CycloneDX)
        # Every npm package here is a dev dependency (the Playwright e2e
        # suite), which syft leaves out unless told otherwise.
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e SYFT_JAVASCRIPT_INCLUDE_DEV_DEPENDENCIES=true -e SYFT_CHECK_FOR_APP_UPDATE=false \
            "$SYFT_IMAGE" dir:. --source-name ultimate-arr-stack --source-version "$GITHUB_SHA" \
            --exclude './node_modules/**' --exclude './tests/bats-core/**' \
            --exclude './tests/bats-support/**' --exclude './tests/bats-assert/**' \
            -o spdx-json=sbom.spdx.json -o cyclonedx-json=sbom.cyclonedx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.*.json
          if-no-files-found: error
      - name: trivy over the tree (vulnerabilities, misconfiguration, secrets)
        # Fails on HIGH or CRITICAL. --include-dev-deps for the same reason
        # as syft: without it the vulnerability scan has no packages at all.
        if: ${{ !cancelled() }}
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src -v trivy-cache:/root/.cache/trivy "$TRIVY_IMAGE" \
            fs --skip-db-update --no-progress --scanners vuln,misconfig,secret --include-dev-deps \
            --severity HIGH,CRITICAL --exit-code 1 \
            --skip-dirs node_modules --skip-dirs tests/bats-core \
            --skip-dirs tests/bats-support --skip-dirs tests/bats-assert .

  image-scan:
    name: nightly — trivy over every compose image
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull the tool image (retried — a registry hiccup must not cost a night's scan)
        run: |
          img="$TRIVY_IMAGE"
          for attempt in 1 2 3 4; do
            docker pull -q "$img" && break
            echo "pull of $img failed (attempt $attempt); retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          docker image inspect "$img" >/dev/null 2>&1 || { echo "::error::could not pull $img after 4 attempts"; exit 1; }
      - name: Fetch trivy's vulnerability database (retried, same reason)
        run: |
          for attempt in 1 2 3 4; do
            docker run --rm -v trivy-cache:/root/.cache/trivy "$TRIVY_IMAGE" image --download-db-only --no-progress && exit 0
            echo "trivy DB download failed (attempt $attempt); retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "::error::could not download trivy's vulnerability database after 4 attempts"
          exit 1
      - name: List the images the compose files use
        # Rendered by compose rather than grepped, so anchors and variables
        # resolve; --profile '*' keeps services that sit behind `profiles:`
        # (configarr), which a plain `config` drops without a word. A compose
        # file that won't render fails the job: a short list would look clean.
        run: |
          mkdir -p trivy-images
          for f in docker-compose.*.yml; do
            docker compose -f "$f" --env-file tests/fixtures/.env.test --profile '*' config --format json \
              | jq -r '.services[].image'
          done | sort -u > trivy-images/images.txt
          cat trivy-images/images.txt
      - name: Scan each image (diagnostic — findings never fail the job)
        # linux/amd64 because that is what the NAS runs. An image that can't
        # be scanned after three tries is a row that says so, not a gap.
        run: |
          mapfile -t images < trivy-images/images.txt
          unscanned=0
          rows=()
          for img in "${images[@]}"; do
            report="trivy-images/${img//[\/:@]/_}.json"
            scanned=
            for attempt in 1 2 3; do
              if docker run --rm -v trivy-cache:/root/.cache/trivy -v "$PWD/trivy-images:/out" "$TRIVY_IMAGE" \
                   image --image-src remote --platform linux/amd64 --skip-db-update --no-progress \
                   --scanners vuln --timeout 20m --format json --output "/out/${report#trivy-images/}" "$img"; then
                scanned=1
                break
              fi
              echo "scan of $img failed (attempt $attempt)"
              if (( attempt < 3 )); then sleep $((attempt * 30)); fi
            done
            row=
            if [[ -n $scanned ]]; then
              row=$(jq -r --arg img "$img" '
                [.Results[]?.Vulnerabilities[]?.Severity] as $s
                | ["CRITICAL", "HIGH", "MEDIUM", "LOW"]
                | map(. as $level | [$s[] | select(. == $level)] | length)
                | "| `\($img)` | \(.[0]) | \(.[1]) | \(.[2]) | \(.[3]) |"' "$report") || row=
            fi
            if [[ -z $row ]]; then
              unscanned=$((unscanned + 1))
              row="| \`$img\` | could not be scanned — see the job log | | | |"
            fi
            rows+=("$row")
          done
          {
            echo "## trivy — compose images (linux/amd64)"
            echo
            echo "${#images[@]} images, $unscanned not scanned. Diagnostic: nothing here fails a build. Full JSON reports are in the \`trivy-images\` artifact."
            echo
            echo "| image | critical | high | medium | low |"
            echo "|---|---:|---:|---:|---:|"
            printf '%s\n' "${rows[@]}"
          } | tee -a "$GITHUB_STEP_SUMMARY"  # the log too: `gh run view --log` can't see a summary
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: trivy-images
          path: trivy-images/

  devcontainer:
    name: nightly — the devcontainer builds
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: docker build
        # hadolint and trivy read this file; nothing else builds it. A
        # nodesource URL change or a dropped apt package would otherwise be
        # found by the next person to rebuild their container.
        run: docker build --no-cache -f .devcontainer/Dockerfile .devcontainer
