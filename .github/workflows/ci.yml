name: CI

# The deterministic half of this repo's tooling: everything that can be judged
# from the tree alone, on a runner that has git and docker. Nothing here reaches
# the NAS. The e2e suite, the deploy pipeline, and tests/network-segmentation.bats'
# live-router assertion all belong to nas-auto-deploy.yml -- or skip themselves
# with a stated reason, which the census in the bats job prints.
#
# main is protected: pull requests required, enforced for admins, and the three
# per-push jobs below -- `bats suite`, `mutation guards for this change` and
# `workflow and terraform lint` -- are required status checks, so a merge cannot
# skip any of them, admins included. This comment used to say the opposite
# ("deliberately not a required status check yet"); that policy decision had
# already been made in the repository settings, and the stale sentence misled two
# readers before it was caught. The branch-protection API is the source of truth,
# not this file:
#
#   gh api repos/<owner>/<repo>/branches/main/protection
#
# The nightly-only job is deliberately NOT required: it is a discovery tool, and
# gating every PR on a sweep that runs for an hour buys no defect detection.
on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']
  workflow_dispatch: {}
  schedule:
    # The expensive halves run nightly rather than per push: the regression
    # corpus runs each entry's oracle twice, and the discovery sweep generates
    # hundreds of mutants per target. 03:23 UTC.
    #
    # No entry count here on purpose. This comment said 276 while the corpus had
    # grown to 323, which is the same stale-number failure CONTRIBUTING.md warns
    # about; `ls tests/mutation/corpus/*.sh` and the run summary are the numbers,
    # and neither needs editing.
    - cron: '23 3 * * *'

concurrency:
  # The event name is part of the group on purpose. Keyed on the ref alone, a
  # push to main cancelled the in-flight nightly dispatch that was still running
  # against it -- observed, not theorised, on the first dispatch: the merge that
  # followed the dispatch killed the sweep mid-run. Per-event groups mean a push
  # can only ever cancel another push, and a scheduled run is never cancelled by
  # anything.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read

jobs:
  bats:
    name: bats suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The mutation job diffs against origin/main, and several suites ask
          # git for tracked files -- a shallow clone answers both wrongly.
          fetch-depth: 0

      - name: Submodules and hooks
        # tests/hooks-installed.bats asserts the symlinks ./setup-hooks.sh
        # creates. A fresh checkout has neither, which is exactly how this step
        # failed on the pipeline's first run -- see CLAUDE.md's live-dispatch log.
        run: |
          set -e
          git submodule update --init --recursive tests/bats-core tests/bats-support tests/bats-assert
          ./setup-hooks.sh

      - name: Run the suite
        # pipefail so a red suite fails the step while tee keeps the output for
        # the census below. This is the whole suite: compose validity, ports and
        # IPs, secret hygiene, env documentation, doc links, YAML, shellcheck,
        # systemd units, every operational script through the stub harness, the
        # containerised pytest run, the mutation corpus freshness check, and the
        # mutation runner's own tests.
        run: |
          set -o pipefail
          ./tests/run-tests.sh 2>&1 | tee "$RUNNER_TEMP/bats.log"

      - name: Census
        if: always()
        # The runner reports executed/skipped/failed and why each skip happened.
        # In a job summary that is the difference between "green" and "green
        # having run nothing" -- the defect class this repo has closed four times.
        run: |
          {
            echo '## bats census'
            echo '```'
            sed -n '/=== census/,$p' "$RUNNER_TEMP/bats.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  mutation-guards:
    name: mutation guards for this change
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Corpus entries that guard the changed files
        # run-mutations.sh is this repo's proof that its guards can fail, and it
        # is far too slow to run whole on every push. This selects the corpus
        # files that guard the files this change touched, and refuses two ways:
        # an unresolvable base, and a run where every selected mutation was
        # SKIPPED -- which run-mutations.sh itself exits 0 on.
        run: ./tests/mutation/check-changed-guards.sh origin/main

  lint:
    name: workflow and terraform lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: actionlint (the workflows themselves)
        # Pinned image, matching this repo's pattern for tools a host lacks.
        # Lints both workflow files, including this one.
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7

      - name: terraform fmt -check
        # Formatting only: no init, no providers, no credentials. terraform/ is
        # the devopsarr config-as-code tree; `terraform validate` needs a network
        # init and belongs in the nightly job if it is wanted at all.
        run: docker run --rm -v "$PWD/terraform:/tf" -w /tf hashicorp/terraform:1.9.8 fmt -check -recursive

  supply-chain:
    name: supply chain (trivy and sbom)
    # Pinned tools, run from their images rather than installed on the host --
    # the same rule actionlint and terraform follow above, and the reason
    # CLAUDE.md keeps the host and CI tool lists separate. Both are pinned by
    # digest: a scanner that floats changes what "clean" means about the same
    # commit, which is the one thing a supply-chain gate must not do.
    #
    # Deliberately NOT a required status check yet. It is a new gate on a
    # scanner whose database is upstream, and a transient DB failure blocking
    # every merge is the failure mode that gets a check disabled. Watch it run
    # for a while, then make it required with:
    #   gh api -X PATCH repos/<owner>/<repo>/branches/main/protection/required_status_checks \
    #     -f 'contexts[]=supply chain (trivy and sbom)' ... (or the UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: SBOM (syft)
        # A software bill of materials for this commit: what is in the tree, in
        # SPDX and CycloneDX. Generated every push, kept as an artifact.
        run: |
          set -e
          docker run --rm -v "$PWD:/repo" -w /repo \
            anchore/syft:v1.51.1@sha256:95fe0835e5bebc6f8b1f8acef68d47d63d594ef4c0f25c097ff853b23cbac74c \
            dir:. -o spdx-json=/repo/sbom.spdx.json -o cyclonedx-json=/repo/sbom.cyclonedx.json

      - name: Upload the SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.cyclonedx.json
          if-no-files-found: error

      - name: Trivy (dependencies and misconfiguration)
        # `--scanners vuln,misconfig` and not `secret`: secret pattern scanning
        # belongs to scripts/lib/check-secrets.sh, which owns the allowlist for
        # this repo's placeholders. A second scanner for the same question is how
        # two answers start disagreeing. (An earlier version of this comment
        # claimed gitleaks covered pre-commit and this workflow. It does not run
        # in either place -- nothing tracked invokes it -- so adding this scanner
        # here would duplicate nothing and change the verdict in CI. Recorded in
        # docs/QUALITY-CONTROL-MAP.md rather than fixed in passing.)
        #
        # HIGH and CRITICAL only: the misconfiguration rules below that are noise
        # for a single-host compose stack, and a gate people learn to ignore is
        # worse than no gate.
        #
        # This is the check that fails CI on a high-severity dependency finding.
        run: |
          set -e
          docker run --rm -v "$PWD:/repo" -w /repo \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            fs --scanners vuln,misconfig --severity HIGH,CRITICAL \
               --exit-code 1 --no-progress .

  heavy:
    name: full corpus and discovery sweep
    # Nightly, or on demand. Not per push: minutes to tens of minutes.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Submodules
        run: git submodule update --init --recursive tests/bats-core tests/bats-support tests/bats-assert

      - name: Full regression corpus (blocking)
        # Every recorded defect must still be caught. This is the gate the
        # per-push job samples from.
        run: ./tests/mutation/run-mutations.sh

      - name: Discovery sweep (non-blocking, time-bounded)
        # universalmutator hunts for code no test guards. Some mutants are
        # equivalent and can never be killed, so this exits 0 whatever it finds
        # and files its survivors in the ledger artifact below.
        #
        # Bounded, because the per-mutant oracle budget bounds each mutant and not
        # the sweep: 13 targets generating hundreds of mutants each, with a
        # containerised oracle, can run for hours against a six-hour job ceiling.
        # A partial sweep is safe by design -- the ledger merge carries untouched
        # targets' verdicts through -- so a timeout costs coverage of the targets
        # that did not run, not the ledger.
        continue-on-error: true
        run: timeout 150m ./tests/mutation/run-generated.sh

      - name: Coverage (a diagnostic, not a gate)
        # kcov reports BLIND rather than 0% for the awk-and-eval idiom; its own
        # README says it is not a gate, so it must not fail the run.
        continue-on-error: true
        run: timeout 20m ./tests/toolkit/coverage.sh

      - name: Container images (trivy, a diagnostic)
        # The images are the dependency surface this stack actually runs. The
        # filesystem scan in the per-push job sees almost none of it: no lockfile
        # is committed for the Node subprojects, and the compose files pin images
        # by tag rather than vendoring them. Nightly and non-blocking for the same
        # reason the sweep is -- it pulls every image, and its database is
        # upstream. `docker compose config` is deliberately not the input here:
        # trivy's misconfig scanner reads the compose files directly, and the
        # per-push job already runs it.
        #
        # The list is the registry images only. `:local` tags are this repo's own
        # builds (four of them, each with a `build:` block) and pulling one from a
        # registry is a failure, not a finding; an image named by a variable is
        # not resolved here on purpose, because resolving it would make this step
        # depend on `.env`, which the runner does not have.
        continue-on-error: true
        run: |
          set -e
          mkdir -p trivy-images
          grep -hE '^[[:space:]]+image:[[:space:]]+[^$]' docker-compose*.yml \
            | sed 's/.*image:[[:space:]]*//' | tr -d '"' | sort -u \
            | grep -v ':local$' > /tmp/images.txt
          while read -r img; do
            [ -n "$img" ] || continue
            echo "== $img"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/trivy-images:/out" \
              aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
              image --severity CRITICAL --ignore-unfixed --no-progress \
              --format json --output "/out/$(printf '%s' "$img" | tr '/:' '__').json" "$img" || true
          done < /tmp/images.txt
          # The last line is the step's evidence, so it goes in the log: which
          # reports exist and how big they are. `find`, not `ls`, because the
          # file names come from image references and carry characters a shell
          # glob would read as patterns. The format string is double-quoted on
          # purpose -- nothing in it is meant to expand.
          find trivy-images -type f -name '*.json' -printf "%10s  %p\n" | sort -k2

      - name: Upload the image scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-images
          path: trivy-images/
          if-no-files-found: warn

      - name: Publish the survivor ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: survivors
          path: tests/mutation/survivors.tsv
          if-no-files-found: warn
