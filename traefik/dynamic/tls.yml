# Traefik Dynamic Configuration - TLS Options
# https://doc.traefik.io/traefik/https/tls/

tls:
  # Internal-CA cert for the local admin-UI tier (mkcert-issued, see
  # docs/HTTPS-LOCAL.md). Explicit multi-SAN cert (one SAN per admin host),
  # NOT a `*.lan` wildcard - OpenSSL-family TLS stacks (curl, and most
  # browsers) refuse wildcard matching against a single-label suffix like
  # `.lan`, treating it like a public-suffix boundary (mkcert's own README
  # flags this as a known wildcard caveat; confirmed here empirically via
  # curl's "subjectAltName does not match host name" failure against a
  # `*.lan` cert). Files are gitignored, NAS-only - not synced by git pull,
  # deploy them onto the NAS's traefik/certs/ directory directly.
  certificates:
    - certFile: /certs/lan-admin.crt
      keyFile: /certs/lan-admin.key

  options:
    default:
      minVersion: VersionTLS12
      sniStrict: true
      cipherSuites:
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
        - TLS_AES_128_GCM_SHA256
        - TLS_AES_256_GCM_SHA384
        - TLS_CHACHA20_POLY1305_SHA256
      curvePreferences:
        - CurveP521
        - CurveP384

    modern:
      minVersion: VersionTLS13
      sniStrict: true

# HTTP Middleware
http:
  middlewares:
    # Security Headers
    security-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        customFrameOptionsValue: "SAMEORIGIN"
        customResponseHeaders:
          X-Robots-Tag: "none,noarchive,nosnippet,notranslate,noimageindex"
          server: ""

    # Rate limiting (adjust as needed)
    rate-limit:
      rateLimit:
        average: 100
        burst: 50
        period: 1m

    # Compression
    compression:
      compress: {}

    # HTTPS redirect
    https-redirect:
      redirectScheme:
        scheme: https
        permanent: true
