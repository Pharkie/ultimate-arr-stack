# Local .lan domain routing (port-free access)
#
# How it works:
# 1. Pi-hole DNS resolves *.lan → TRAEFIK_LAN_IP (macvlan, e.g. 10.10.0.11)
# 2. Browser requests http://sonarr.lan → Traefik on port 80 (macvlan IP)
# 3. Traefik matches Host header → routes to correct service:port
#
# Result: http://sonarr.lan instead of http://10.10.0.10:8989
#
# Note: Requires Traefik macvlan setup (see docs/LOCAL-DNS.md)
#
# Admin-UI tier (everything except Media Services below): each router below
# has a `-secure` twin on the `websecure` entrypoint requiring basicauth
# (`admin-auth@docker`, see docker-compose.traefik.yml) and serving the
# mkcert-issued internal cert (see docs/HTTPS-LOCAL.md). The `web` (:80)
# router now just 301s to https via the `https-redirect` middleware instead
# of serving the app directly - these are unauthenticated-by-default admin
# panels (qBittorrent explicitly bypasses its own login for LAN clients),
# so this is the only auth layer they get today. Media Services stays
# plain HTTP on .lan, unchanged - Cloudflare already terminates TLS and
# both apps have real app-level auth for their public-facing access.

http:
  routers:
    # === Media Services ===
    jellyfin-lan:
      rule: "Host(`jellyfin.lan`)"
      entryPoints: [web]
      service: jellyfin-lan

    seerr-lan:
      rule: "Host(`seerr.lan`)"
      entryPoints: [web]
      service: seerr-lan

    # Legacy redirects (jellyseerr/jellyseer → seerr)
    jellyseerr-lan:
      rule: "Host(`jellyseerr.lan`)"
      entryPoints: [web]
      middlewares: [jellyseerr-redirect]
      service: seerr-lan

    jellyseer-lan:
      rule: "Host(`jellyseer.lan`)"
      entryPoints: [web]
      middlewares: [jellyseerr-redirect]
      service: seerr-lan

    # === *arr Stack (VPN-protected via Gluetun) ===
    sonarr-lan:
      rule: "Host(`sonarr.lan`)"
      entryPoints: [web]
      middlewares: [https-redirect]
      service: sonarr-lan
    sonarr-lan-secure:
      rule: "Host(`sonarr.lan`)"
      entryPoints: [websecure]
      tls: {}
      middlewares: [admin-auth@docker, security-headers]
      service: sonarr-lan

    radarr-lan:
      rule: "Host(`radarr.lan`)"
      entryPoints: [web]
      middlewares: [https-redirect]
      service: radarr-lan
    radarr-lan-secure:
      rule: "Host(`radarr.lan`)"
      entryPoints: [websecure]
      tls: {}
      middlewares: [admin-auth@docker, security-headers]
      service: radarr-lan

    prowlarr-lan:
      rule: "Host(`prowlarr.lan`)"
      entryPoints: [web]
      middlewares: [https-redirect]
      service: prowlarr-lan
    prowlarr-lan-secure:
      rule: "Host(`prowlarr.lan`)"
      entryPoints: [websecure]
      tls: {}
      middlewares: [admin-auth@docker, security-headers]
      service: prowlarr-lan

    bazarr-lan:
      rule: "Host(`bazarr.lan`)"
      entryPoints: [web]
      middlewares: [https-redirect]
      service: bazarr-lan
    bazarr-lan-secure:
      rule: "Host(`bazarr.lan`)"
      entryPoints: [websecure]
      tls: {}
      middlewares: [admin-auth@docker, security-headers]
      service: bazarr-lan

    # === Download Clients ===
    qbit-lan:
      rule: "Host(`qbit.lan`)"
      entryPoints: [web]
      middlewares: [https-redirect]
      service: qbit-lan
    qbit-lan-secure:
      rule: "Host(`qbit.lan`)"
      entryPoints: [websecure]
      tls: {}
      middlewares: [admin-auth@docker, security-headers]
      service: qbit-lan

    sabnzbd-lan:
      rule: "Host(`sabnzbd.lan`)"
      entryPoints: [web]
      middlewares: [https-redirect]
      service: sabnzbd-lan
    sabnzbd-lan-secure:
      rule: "Host(`sabnzbd.lan`)"
      entryPoints: [websecure]
      tls: {}
      middlewares: [admin-auth@docker, security-headers]
      service: sabnzbd-lan

    # === Infrastructure ===
    traefik-lan:
      rule: "Host(`traefik.lan`)"
      entryPoints: [web]
      middlewares: [https-redirect]
      service: api@internal
    traefik-lan-secure:
      rule: "Host(`traefik.lan`)"
      entryPoints: [websecure]
      tls: {}
      middlewares: [admin-auth@docker, security-headers]
      service: api@internal

    pihole-lan:
      rule: "Host(`pihole.lan`)"
      entryPoints: [web]
      middlewares: [https-redirect]
      service: pihole-lan
    pihole-lan-secure:
      rule: "Host(`pihole.lan`)"
      entryPoints: [websecure]
      tls: {}
      middlewares: [admin-auth@docker, security-headers]
      service: pihole-lan

    # === Utilities ===
    uptime-lan:
      rule: "Host(`uptime.lan`)"
      entryPoints: [web]
      middlewares: [https-redirect]
      service: uptime-lan
    uptime-lan-secure:
      rule: "Host(`uptime.lan`)"
      entryPoints: [websecure]
      tls: {}
      middlewares: [admin-auth@docker, security-headers]
      service: uptime-lan

    duc-lan:
      rule: "Host(`duc.lan`)"
      entryPoints: [web]
      middlewares: [https-redirect]
      service: duc-lan
    duc-lan-secure:
      rule: "Host(`duc.lan`)"
      entryPoints: [websecure]
      tls: {}
      middlewares: [admin-auth@docker, security-headers]
      service: duc-lan

    beszel-lan:
      rule: "Host(`beszel.lan`)"
      entryPoints: [web]
      middlewares: [https-redirect]
      service: beszel-lan
    beszel-lan-secure:
      rule: "Host(`beszel.lan`)"
      entryPoints: [websecure]
      tls: {}
      middlewares: [admin-auth@docker, security-headers]
      service: beszel-lan

  middlewares:
    jellyseerr-redirect:
      redirectRegex:
        regex: "^http://jellyseer{1,2}[.]lan(.*)"
        replacement: "http://seerr.lan${1}"
        permanent: true

  services:
    # === Media Services ===
    jellyfin-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.4:8096"

    seerr-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.8:5055"

    # === *arr Stack ===
    # Sonarr/Radarr now run on the arr-core bridge with their own IPs
    # (no longer behind Gluetun). Prowlarr stays behind Gluetun (172.20.0.3).
    sonarr-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.10:8989"

    radarr-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.11:7878"

    prowlarr-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.3:9696"

    bazarr-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.9:6767"

    # === Download Clients (via Gluetun) ===
    qbit-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.3:8085"

    sabnzbd-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.3:8080"

    # === Infrastructure ===
    pihole-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.5:80"

    # === Utilities ===
    uptime-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.13:3001"

    duc-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.14:80"

    beszel-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.15:8090"
