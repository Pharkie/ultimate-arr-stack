# ═══════════════════════════════════════════════════════════════════════════════
# TAILSCALE - Remote access to your full LAN via mesh VPN
#
# What it does:
# - Acts as a subnet router: advertises your LAN (e.g. 10.10.0.0/24) to your
#   Tailscale tailnet so phones/laptops can reach Pi-hole, *.lan domains,
#   Home Assistant, NAS admin UIs, etc. from anywhere.
# - Traverses CGNAT (no port-forward needed) and falls back to a relay over
#   :443 if direct UDP fails — works on hotel WiFi, mobile, anywhere.
#
# When to use this (vs Cloudflare Tunnel):
# - Cloudflared exposes specific HTTP services to the public internet.
# - Tailscale gives YOU (and authorised devices) private access to the whole
#   LAN — including non-HTTP services and admin UIs you'd never expose publicly.
# - The two are complementary, not alternatives. Run both.
#
# Requires: free Tailscale account (https://tailscale.com).
# Setup: see docs/TAILSCALE.md.
#
# Uses a separate compose project name so operations on other files don't
# accidentally stop the tunnel.
# ═══════════════════════════════════════════════════════════════════════════════

name: tailscale

services:
  tailscale:
    image: tailscale/tailscale:v1.98.10
    container_name: tailscale
    hostname: ${TS_HOSTNAME:-arr-stack-nas}
    # network_mode: host is required for subnet routing — the daemon needs
    # to see the host's LAN interface to advertise/route its subnet.
    network_mode: host
    # cap_drop: ALL isn't possible here - network_mode: host + subnet/exit-node
    # routing genuinely needs NET_ADMIN/NET_RAW. no-new-privileges is the one
    # hardening flag compatible with that.
    security_opt:
      - no-new-privileges:true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - tailscale-state:/var/lib/tailscale
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      # Don't override the NAS's resolver (Pi-hole stays the LAN DNS).
      # Split-DNS for *.lan is configured in the Tailscale admin console.
      - TS_ACCEPT_DNS=false
      # Auth: leave TS_AUTHKEY unset for interactive first-run auth.
      # First start prints a login URL in `docker logs tailscale` — open it,
      # authenticate, then approve the route in the admin console.
      # (Optional) for unattended re-auth: set TS_AUTHKEY=tskey-auth-... in .env
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      # Advertises your LAN subnet (LAN_SUBNET from .env) so tailnet peers can
      # reach the whole network. Add extra subnets with TS_EXTRA_ROUTES if needed.
      # NOTE: --advertise-exit-node is DELIBERATELY ABSENT. Node 1 must never
      # offer itself as an exit node, for two independent reasons:
      #   1. It does not work. Tailscale writes its exit-node rules to the
      #      LEGACY iptables tables (ts-postrouting MASQUERADE on mark
      #      0x40000, ts-forward ACCEPT) while Docker and UGOS use the NFT
      #      backend, where filter carries -P FORWARD DROP and UG_FORWARD
      #      accepts only -i lo plus conntrack RELATED,ESTABLISHED. Nothing
      #      accepts new forwarded flows from tailscale0, so exit traffic is
      #      dropped. Verified twice with a 20s settle: zero egress, DNS
      #      fails, HTTP 000, 0 bytes on bulk download -- while `tailscale
      #      ping` still reports 2ms. Subnet routing is unaffected and keeps
      #      working, which is exactly what makes this so confusing.
      #   2. Fixing it would be WORSE than leaving it broken. A working node-1
      #      exit node egresses via the HOME IP -- precisely the fallback the
      #      leak test (Go/No-Go check I) exists to catch. The whole point of
      #      this stack is that internet egress leaves via ProtonVPN through
      #      `tailscale-exit` below, never via the home connection.
      # The user selected `arr-stack-nas` as their exit node by mistake and
      # spent days debugging a phantom "barely connects" problem as a direct
      # result. Leaving the option visible is the footgun; removing the flag
      # removes it from `tailscale exit-node list` entirely.
      # NOTE ALSO: the ACL's autoApprovers.exitNode grants tag:nas-router, so
      # unapproving node 1 in the admin console is NOT durable -- it would be
      # auto-re-approved the moment it advertised again. Not advertising in
      # the first place is the only fix that holds.
      # --advertise-tags=tag:nas-router requires tag:nas-router to already
      # exist in the tailnet's ACL policy's tagOwners (see docs/TAILSCALE.md
      # step 6). Confirmed live 2026-08-17: requesting a tag not yet in
      # tagOwners doesn't just drop the tag with a warning — it fails the
      # entire `tailscale up` authorization, so the node can't log in at all
      # until the tag is removed or the policy grants it. ACL policy with
      # tag:nas-router confirmed live 2026-08-17 before this flag was added
      # back — don't remove tag:nas-router from tagOwners without also
      # removing --advertise-tags here first, same failure mode in reverse.
      # --reset is needed once, to clear the stuck state from the earlier
      # failed attempt (see docs/TAILSCALE.md troubleshooting) — safe to
      # drop after this recreate is confirmed stable.
      # ORDERING CONSTRAINT: do not drop --reset until the exit-node removal
      # above has been applied at least once. `tailscale up --reset` forces
      # prefs to exactly these args; without it, a previously-stored
      # AdvertiseRoutes containing 0.0.0.0/0 and ::/0 would simply persist in
      # the state DB and node 1 would keep offering a dead exit node.
      - TS_EXTRA_ARGS=--advertise-routes=${LAN_SUBNET}${TS_EXTRA_ROUTES:+,${TS_EXTRA_ROUTES}} --accept-routes --advertise-tags=tag:nas-router --reset
    healthcheck:
      test: ["CMD", "tailscale", "status", "--peers=false"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ═══════════════════════════════════════════════════════════════════════════
  # GLUETUN-EXIT - a SECOND, dedicated ProtonVPN tunnel whose only job is to be
  # the internet egress for the tailscale-exit node below. Deliberately NOT the
  # `gluetun` in docker-compose.arr-stack.yml:
  #   - making Tailscale forward through Gluetun needs the FORWARD chain
  #     opened, and the commonly published fix (FIREWALL=off) would gut the
  #     download stack's kill switch — the entire reason gluetun exists here;
  #   - gluetun-rotator (docker-compose.utilities.yml) runs `docker restart
  #     gluetun` every GLUETUN_ROTATE_INTERVAL_SECONDS (default 6h) BY DESIGN
  #     to rotate exit servers, which would destroy this netns and drop every
  #     in-flight exit-node session four times a day;
  #   - it lets the browsing exit country diverge from the download country.
  # Costs a second ProtonVPN device slot against your plan's connection limit.
  # ═══════════════════════════════════════════════════════════════════════════
  gluetun-exit:
    image: qmcgaw/gluetun:v3.41
    container_name: gluetun-exit
    security_opt:
      - no-new-privileges:true
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    # net.* sysctls are network-NAMESPACED, and Docker only applies them to a
    # container that CREATES its own netns — it skips them for a container
    # joining an existing one. tailscale-exit joins THIS netns, so its
    # exit-node forwarding sysctls must be declared here, not there.
    # If gluetun-exit refuses to start with "invalid argument", drop the ipv6
    # line (IPv6 disabled in this netns) — IPv4 exit-node still works.
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.forwarding=1
    volumes:
      - gluetun-exit-config:/gluetun
      # Custom iptables rules, run by gluetun at container start after its own.
      # Lets us open the FORWARD chain for exit-node traffic while keeping
      # FIREWALL=on, instead of the published FIREWALL=off workaround.
      - ./tailscale/gluetun-exit-post-rules.txt:/iptables/post-rules.txt:ro
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - WIREGUARD_PRIVATE_KEY=${VPN_EXIT_WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${VPN_EXIT_WIREGUARD_ADDRESSES}
      - SERVER_COUNTRIES=${VPN_EXIT_COUNTRIES}
      - TZ=${TZ}
      # Deliberately NOT DNS_ADDRESS=172.20.0.5 (Pi-hole), unlike the download
      # gluetun: with an exit node selected, the PHONE's DNS is resolved here.
      # Pi-hole blocklists would then apply to all remote browsing (surprising
      # false positives away from home) and Pi-hole downtime would kill the
      # exit node's DNS entirely. Gluetun's built-in DoT default is used.
      #
      # The tailnet ranges (100.64.0.0/10, fd7a:115c:a1e0::/48) are deliberately
      # NOT listed here, even though this netns must reach 100.100.100.100 once
      # tailscale-exit runs --accept-dns=true.
      #   IPv4: listing it makes gluetun install its OWN ip rule
      #     "to 100.64.0.0/10 lookup 199" at priority 99, which routes tailnet
      #     traffic out eth0 and displaces the "lookup 52" rule the exit node's
      #     return path depends on. Caught live -- the damage is silent, because
      #     the sidecar's idempotency grep then matches gluetun's rule and skips
      #     installing the correct one.
      #   IPv6: ignored outright ("no default route matching its family"),
      #     since the Proton tunnel here is IPv4-only.
      # tailscale-exit-routing grants both in OUTPUT instead, which opens the
      # firewall without perturbing routing.
      - FIREWALL_OUTBOUND_SUBNETS=${LAN_SUBNET},172.20.0.0/24
      # Health must NOT depend on DNS. Note the plural: HEALTH_TARGET_ADDRESS
      # (singular) is silently ignored by this image, which was easy to miss
      # because the container stays healthy either way -- gluetun's healthcheck
      # uses its own internal resolver, not resolv.conf. The risk being closed
      # here is the cascade: a DNS-dependent healthcheck failing -> deunhealth
      # restarts gluetun -> the shared netns dies -> tailscale-exit is left a
      # zombie. IP literals break that circular dependency at the root.
      - HEALTH_TARGET_ADDRESSES=1.1.1.1:443,1.0.0.1:443
      # NOT enabling VPN_PORT_FORWARDING: NAT-PMP hands out a DYNAMIC port
      # re-leased ~every 60s, while `tailscaled --port` is static — and even
      # reconciled it wouldn't help, since Tailscale advertises whatever STUN
      # discovers rather than a chosen endpoint. See docs/TAILSCALE.md.
    networks:
      arr-core:
        ipv4_address: 172.20.0.18
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s

  # ═══════════════════════════════════════════════════════════════════════════
  # TAILSCALE-EXIT - second tailnet node, exit-node ONLY (no subnet routes;
  # the host-network `tailscale` above owns those and is left untouched, which
  # is also the rollback: pick a different exit node from the phone).
  # Shares gluetun-exit's netns, so its internet egress IS the ProtonVPN tunnel
  # by construction.
  #
  # Reuses tag:nas-router, which docs/TAILSCALE.md's ACL policy already lists
  # in BOTH tagOwners and autoApprovers.exitNode — so this node self-approves
  # its exit node with zero admin-console clicks, and sidesteps the documented
  # hard-fail when advertising a tag that isn't in tagOwners.
  #
  # No `ports:` — a container sharing another's netns cannot declare its own
  # (same constraint magnetio-addon documents). None is needed anyway: peers
  # reach this node via the ProtonVPN exit IP, not the home WAN IP.
  # ═══════════════════════════════════════════════════════════════════════════
  tailscale-exit:
    image: tailscale/tailscale:v1.98.10
    container_name: tailscale-exit
    network_mode: "service:gluetun-exit"
    depends_on:
      gluetun-exit:
        condition: service_healthy
        restart: true
    security_opt:
      - no-new-privileges:true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - tailscale-exit-state:/var/lib/tailscale
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      # MUST be true here, unlike the host-network node (which sets it false so
      # it never hijacks the NAS's own resolver). An exit node resolves DNS on
      # its CLIENTS' behalf via peerapi: select this exit node on a phone and
      # every lookup that phone makes is answered here, not there.
      #   accept-dns=false => tailscaled forwards those to the netns system
      #     resolver, which is gluetun's DoT -> Cloudflare. Cloudflare answers
      #     *.lan with rcode 5 REFUSED (it is not a public domain), so the phone
      #     gets DNS_PROBE_POSSIBLE for sonarr.lan while public names resolve.
      #     Observed live 2026-08-22; the tell is `peerapi: handleDNS fwd error`
      #     plus `response code indicating refusal: 5` in this container's logs.
      #   accept-dns=true  => tailscaled uses the TAILNET DNS config, so it
      #     honours split DNS: *.lan -> Pi-hole over eth0, everything else ->
      #     1.1.1.1, which still egresses through the Proton tunnel.
      # This rewrites resolv.conf for the whole SHARED netns, so it depends on
      # tailscale-exit-routing's OUTPUT rules to let the netns reach tailscaled's
      # own resolvers past gluetun's kill switch.
      - TS_ACCEPT_DNS=true
      # An auth key is effectively REQUIRED here (unlike the host-network node,
      # which can be authed interactively): this container has no host
      # networking, so reading a login URL out of its logs is the only other
      # path. Use a REUSABLE, non-ephemeral key so a recreate re-auths cleanly.
      - TS_AUTHKEY=${TS_EXIT_AUTHKEY:-}
      - TS_HOSTNAME=${TS_EXIT_HOSTNAME:-arr-stack-vpn-exit}
      # Gluetun's Alpine base drives nftables through the iptables-nft compat
      # layer. Forcing tailscaled to the same backend puts its ts-forward /
      # ts-postrouting chains in the SAME table gluetun manages, so ordering is
      # deterministic. Left on `auto`, tailscaled can pick the legacy backend
      # and silently write rules nothing ever evaluates. If `iptables -S
      # FORWARD` shows no ts-forward jump, try nftables here instead.
      - TS_DEBUG_FIREWALL_MODE=iptables
      # Exit node ONLY — no subnet routes (node 1 owns subnet routing), and
      # deliberately NO --reset (node 1 needs it once; here it would wipe any
      # `tailscale set` tweaks, e.g. peer-relay config, on every restart).
      #
      # IPv4 ONLY, deliberately. `--advertise-exit-node` is exactly equivalent
      # to `--advertise-routes=0.0.0.0/0,::/0`, and the ::/0 half is a lie here:
      # the Proton tunnel behind this node is IPv4-only, so there is no v6
      # default route in this netns and gluetun's ip6tables policy is
      # `-P FORWARD DROP` / `-P OUTPUT DROP` on both backends. A client that
      # takes us up on ::/0 gets a *silent* black hole — the kernel does emit an
      # ICMPv6 unreachable for the unroutable packet, and the OUTPUT DROP then
      # eats it on the way back, so the client sees nothing to fail fast on and
      # burns a full connect timeout instead. Measured 2026-08-23: `curl -6`
      # through this node stalls the entire 25s timeout with no response, while
      # `curl -4` returns in 0.05s.
      #
      # DO NOT try to fix this by advertising 0.0.0.0/0 alone. That was tried
      # on 2026-08-23 and `tailscale up` rejects it outright — "0.0.0.0/0
      # advertised without its IPv6 counterpart, please also advertise ::/0",
      # exit status 1, container never comes up. There is no supported way to
      # be an IPv4-only exit node; the ::/0 advertisement is mandatory. The
      # black hole therefore has to be handled downstream of the advertisement,
      # in the routing sidecar, not here.
      - TS_EXTRA_ARGS=--advertise-exit-node --advertise-tags=tag:nas-router
    labels:
      # This label + the network-touching healthcheck below are what cover the
      # "running zombie on a dead netns" failure mode that gluetun-recover
      # exists for: unlike a localhost-only check, this one FAILS when
      # gluetun-exit's netns is destroyed, so deunhealth restarts it.
      - deunhealth.restart.on.unhealthy=true
      - gluetun-exit.dependent=true
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # Reachable => also require real egress (catches the dead-netns zombie).
      # NOT reachable because we're logged OUT is a different thing entirely,
      # and how it's handled depends on whether we can self-heal:
      #   - TS_AUTHKEY set    => a restart re-authenticates, so fail and let
      #                          deunhealth restart us.
      #   - TS_AUTHKEY empty  => a restart CANNOT log us back in. Worse, each
      #                          one makes `tailscale up` mint a fresh nodekey,
      #                          invalidating any interactive login URL already
      #                          issued and leaving an orphaned machine in the
      #                          tailnet. Observed live: 9 restarts, 9 dead
      #                          nodekeys, and a login the user had already
      #                          completed silently detached. Report healthy
      #                          and let the operator see "Logged out" in the
      #                          logs instead of spinning.
      # $$ escapes compose's own interpolation so the shell expands it.
      test: ["CMD-SHELL", 'if tailscale status --peers=false >/dev/null 2>&1; then wget -q --spider --timeout=5 https://controlplane.tailscale.com; else [ -z "$$TS_AUTHKEY" ] && exit 0; exit 1; fi']
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s

  # ═══════════════════════════════════════════════════════════════════════════
  # TAILSCALE-EXIT-ROUTING - the piece that makes the above actually work.
  #
  # Gluetun installs a high-priority `ip rule` (~pref 101) sending ALL traffic
  # to the VPN table. Exit-node RETURN traffic destined for the tailnet
  # (100.64.0.0/10) therefore goes back out the VPN interface instead of
  # tailscale0 — a black hole. Tailscale's own rule for its table 52 sits at
  # pref 5270, far too late to win. Fix: one higher-priority rule at pref 99.
  # Gluetun's FORWARD policy is also DROP, so exit-node traffic needs explicit
  # ACCEPTs on top of the post-rules file.
  #
  # Reconciled in a loop rather than applied once, because gluetun rebuilds its
  # routing on every tunnel reconnect and tailscaled rebuilds table 52 on every
  # restart. Every operation is guarded by a check, so it's idempotent and safe
  # to run forever.
  #
  # Reuses the already-pinned tailscale image purely because it ships iproute2
  # + iptables — no new image to pin, no runtime `apk add`. Inline
  # `entrypoint: /bin/sh -c |` sidecars are an established pattern in this repo
  # (see gluetun-recover / gluetun-rotator in docker-compose.utilities.yml).
  # ═══════════════════════════════════════════════════════════════════════════
  tailscale-exit-routing:
    image: tailscale/tailscale:v1.98.10
    container_name: tailscale-exit-routing
    network_mode: "service:gluetun-exit"
    depends_on:
      gluetun-exit:
        condition: service_healthy
        restart: true
    security_opt:
      - no-new-privileges:true
    cap_add:
      - NET_ADMIN
    labels:
      - gluetun-exit.dependent=true
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "tailscale-exit-routing: reconciling every 30s"
        while true; do
          # Whichever interface gluetun brought up (wg0 wireguard, tun0 openvpn).
          VPN_IF=""
          for i in wg0 tun0; do
            ip link show "$$i" >/dev/null 2>&1 && VPN_IF="$$i"
          done
          if [ -n "$$VPN_IF" ]; then
            # 1. Return path: tailnet-destined packets must use tailscale's
            #    table 52, not gluetun's VPN table.
            #    Match the FULL rule, not just the prefix: gluetun installs its
            #    own "to 100.64.0.0/10 lookup 199" if that range is ever added
            #    to FIREWALL_OUTBOUND_SUBNETS, and a bare-prefix grep would then
            #    match it and silently skip installing this one.
            ip rule show | grep -q "100.64.0.0/10 lookup 52" || \
              ip rule add to 100.64.0.0/10 priority 99 lookup 52
            ip -6 rule show 2>/dev/null | grep -q "fd7a:115c:a1e0::/48" || \
              ip -6 rule add to fd7a:115c:a1e0::/48 priority 99 lookup 52 2>/dev/null || true
            # 2. Forward path: gluetun's FORWARD policy is DROP.
            iptables -C FORWARD -i tailscale0 -o "$$VPN_IF" -j ACCEPT 2>/dev/null || \
              iptables -A FORWARD -i tailscale0 -o "$$VPN_IF" -j ACCEPT
            iptables -C FORWARD -i "$$VPN_IF" -o tailscale0 -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT 2>/dev/null || \
              iptables -A FORWARD -i "$$VPN_IF" -o tailscale0 -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
            # 3. SNAT out the tunnel. Tailscale's ts-postrouting normally does
            #    this via its 0x40000 fwmark; belt-and-braces because that rule
            #    is the piece most likely to land in a table gluetun ignores.
            iptables -t nat -C POSTROUTING -o "$$VPN_IF" -j MASQUERADE 2>/dev/null || \
              iptables -t nat -A POSTROUTING -o "$$VPN_IF" -j MASQUERADE
            # 4. Clamp TCP MSS to the tailscale0 path. WITHOUT THIS THE EXIT
            #    NODE IS UNUSABLE FOR BULK TRANSFER: measured 0.17 Mbps down
            #    with 41.4% packet loss from a phone, against 103 Mbps on the
            #    same 4G with no VPN.
            #    Nesting means two MTUs in a row -- tailscale0 is 1280, gluetun's
            #    tun0 is 1320 -- and tailscale's ts-forward chain only marks and
            #    ACCEPTs, it does not clamp. So a remote server advertises MSS
            #    1460, its full-size replies reach tun0 fine, and then do not fit
            #    into tailscale0. Path MTU discovery cannot recover it either:
            #    the ICMP fragmentation-needed that would signal the sender is
            #    dropped by gluetun's kill switch, so it black-holes silently.
            #    Small responses fit and work perfectly, which is why DNS, .lan
            #    pages and ifconfig.me all looked healthy while throughput was
            #    ~600x below line rate. 1240 = tailscale0's 1280 - 40 bytes of
            #    IPv4 + TCP header. Clamped on SYN in both directions.
            iptables-nft -t mangle -C FORWARD -o tailscale0 -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --set-mss 1240 2>/dev/null || \
              iptables-nft -t mangle -A FORWARD -o tailscale0 -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --set-mss 1240 2>/dev/null || true
            iptables-nft -t mangle -C FORWARD -i tailscale0 -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --set-mss 1240 2>/dev/null || \
              iptables-nft -t mangle -A FORWARD -i tailscale0 -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --set-mss 1240 2>/dev/null || true
            # 5. Firewall grants for tailscaled's own resolvers.
            #    IPv4 half: gluetun's "-P OUTPUT DROP" would
            #    otherwise block the netns from reaching tailscaled's own
            #    resolver at 100.100.100.100, and every lookup in the netns
            #    fails with "Operation not permitted". Not a kill-switch hole:
            #    tailscale0 carries WireGuard to tailnet peers, never raw
            #    internet egress.
            iptables-nft -C OUTPUT -o tailscale0 -j ACCEPT 2>/dev/null || \
              iptables-nft -A OUTPUT -o tailscale0 -j ACCEPT 2>/dev/null || true
            #    IPv6 half: tailscale-exit runs --accept-dns=true, which puts
            #    BOTH 100.100.100.100 and fd7a:115c:a1e0::53 in resolv.conf.
            #    musl (Alpine) queries every listed nameserver instead of
            #    falling back, so one EPERM write fails the whole lookup even
            #    when the IPv4 resolver would have answered. gluetun cannot
            #    allow this itself: it logs "ignoring subnet
            #    fd7a:115c:a1e0::/48 which has no default route matching its
            #    family" because the Proton tunnel here is IPv4-only, so the
            #    rule has to be added directly. NOTE this is about THIS netns
            #    reaching tailscaled's resolver over the tailnet — it is
            #    unrelated to, and unaffected by, this node no longer
            #    advertising ::/0 to clients.
            #    ip6tables-nft explicitly, NOT plain ip6tables: this image
            #    symlinks ip6tables -> ip6tables-legacy, and gluetun's
            #    "-P OUTPUT DROP" lives in the nft tables. Both backends are
            #    evaluated at the same hooks, so an ACCEPT in legacy does not
            #    override a DROP policy in nft -- the rule has to go where the
            #    DROP is. Verified live: the legacy rule applied cleanly and
            #    changed nothing.
            ip6tables-nft -C OUTPUT -o tailscale0 -j ACCEPT 2>/dev/null || \
              ip6tables-nft -A OUTPUT -o tailscale0 -j ACCEPT 2>/dev/null || true
          fi
          sleep 30
        done


  # ═══════════════════════════════════════════════════════════════════════════
  # GLUETUN-EXIT-ROTATOR - Keeps gluetun-exit off slow ProtonVPN servers.
  #
  # WHY THIS EXISTS. ProtonVPN's Netherlands pool is not uniform. Measured on
  # this NAS 2026-08-23, back to back, same 20MB payload:
  #   103.69.224.76   0.5-3 Mbps, and 100MB flows never completed at all
  #   185.107.44.149  78/92/98 Mbps
  #   main gluetun    144 Mbps  (control, different server, same box)
  # A bad draw is therefore a ~30x regression that presents to the user as
  # "connects, works a few seconds, then dies" -- exactly the symptom that sent
  # this project chasing MTU, IPv6 and DERP for two days. gluetun's own
  # healthcheck cannot catch it: a TCP/TLS probe to 1.1.1.1:443 passes fine on a
  # server delivering 0.5 Mbps. Health is not speed.
  #
  # WHY NOT `docker restart` (the gluetun-rotator pattern next door).
  # gluetun-exit's netns is shared by tailscale-exit via
  # network_mode: service:gluetun-exit. Restarting the container gives it a NEW
  # netns, orphaning tailscale-exit until deunhealth notices ~2 min later -- and
  # Android clients do NOT re-establish on their own when that happens, they sit
  # stranded until the user manually toggles Tailscale. Measured during the
  # 2026-08-23 leak test. So this rotator drives gluetun's control-server API
  # instead, which swaps the WireGuard peer IN PLACE. Verified: after an API
  # rotation tailscale-exit was still "Up 56 minutes (healthy)" on an unchanged
  # netns.
  #
  # NEVER change this to restart, stop, or recreate a container.
  # ═══════════════════════════════════════════════════════════════════════════
  gluetun-exit-rotator:
    # Reuses the image gluetun-exit itself runs -- nothing new to pin, and it is
    # guaranteed to have the busybox wget/nc this script needs.
    image: qmcgaw/gluetun:v3.41
    container_name: gluetun-exit-rotator
    # Must be INSIDE the netns: the control server binds :8000 there and is
    # deliberately not opened on eth0 (FIREWALL_INPUT_PORTS is empty), because
    # it is unauthenticated and arr-core is a shared network. Being in the netns
    # also means the throughput probe measures the real tunnel.
    network_mode: "service:gluetun-exit"
    depends_on:
      gluetun-exit:
        condition: service_healthy
        restart: true
    security_opt:
      - no-new-privileges:true
    labels:
      - gluetun-exit.dependent=true
    environment:
      - TZ=${TZ}
      - GLUETUN_EXIT_ROTATE_INTERVAL_SECONDS=${GLUETUN_EXIT_ROTATE_INTERVAL_SECONDS:-21600}
      - GLUETUN_EXIT_MIN_MBPS=${GLUETUN_EXIT_MIN_MBPS:-20}
      - GLUETUN_EXIT_MAX_ATTEMPTS=${GLUETUN_EXIT_MAX_ATTEMPTS:-5}
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -u
        PROBE_BYTES=10000000

        # No curl in this image, and busybox wget cannot set an HTTP method, so
        # the PUT is hand-rolled over nc. Content-Length must be exact or the
        # control server rejects the body -- getting this wrong fails with
        # "invalid character 's' looking for beginning of object key string".
        vpn() {
          body="{\"status\":\"$$1\"}"
          printf 'PUT /v1/vpn/status HTTP/1.1\r\nHost: 127.0.0.1\r\nContent-Type: application/json\r\nContent-Length: %s\r\nConnection: close\r\n\r\n%s' \
            "$${#body}" "$$body" | nc 127.0.0.1 8000 >/dev/null 2>&1
        }

        pubip() {
          wget -q -T 10 -O - http://127.0.0.1:8000/v1/publicip/ip 2>/dev/null \
            | sed -n 's/.*"public_ip":"\([^"]*\)".*/\1/p'
        }

        # IP literal on purpose: a DNS-dependent liveness check would make this
        # rotator rotate whenever DNS hiccupped, the same circular dependency
        # HEALTH_TARGET_ADDRESSES already avoids on gluetun-exit itself.
        tunnel_up() { nc -w 5 -z 1.1.1.1 443 >/dev/null 2>&1; }

        # Mbps, whole numbers. busybox `date` has no %N, so this is
        # second-granularity -- fine, because the decision threshold is ~20 Mbps
        # where a 10MB probe takes ~4s. Returns 0 if the payload did not arrive
        # in full, which is itself the signature of a bad server.
        measure() {
          start=$$(date +%s)
          bytes=$$(wget -q -T 60 -O - "https://speed.cloudflare.com/__down?bytes=$$PROBE_BYTES" 2>/dev/null | wc -c)
          end=$$(date +%s)
          secs=$$((end - start))
          [ "$$secs" -lt 1 ] && secs=1
          if [ "$$bytes" -lt "$$PROBE_BYTES" ]; then echo 0; else echo $$((bytes * 8 / secs / 1000000)); fi
        }

        ensure_fast() {
          if ! tunnel_up; then
            echo "gluetun-exit-rotator: tunnel is DOWN (1.1.1.1:443 unreachable) - not rotating, gluetun's own healthcheck owns this case"
            return 0
          fi
          i=1
          while [ "$$i" -le "$$GLUETUN_EXIT_MAX_ATTEMPTS" ]; do
            mbps=$$(measure)
            ip=$$(pubip)
            if [ "$$mbps" -ge "$$GLUETUN_EXIT_MIN_MBPS" ]; then
              echo "gluetun-exit-rotator: OK - $$ip at $${mbps} Mbps (min $${GLUETUN_EXIT_MIN_MBPS})"
              return 0
            fi
            echo "gluetun-exit-rotator: SLOW - $$ip at $${mbps} Mbps (min $${GLUETUN_EXIT_MIN_MBPS}), rotating server (attempt $$i/$$GLUETUN_EXIT_MAX_ATTEMPTS)"
            vpn stopped
            sleep 5
            vpn running
            # Wait for a public IP to reappear before judging the new server.
            j=1
            while [ "$$j" -le 12 ]; do
              sleep 10
              [ -n "$$(pubip)" ] && break
              j=$$((j + 1))
            done
            i=$$((i + 1))
          done
          echo "gluetun-exit-rotator: WARNING - gave up after $$GLUETUN_EXIT_MAX_ATTEMPTS rotations, still under $${GLUETUN_EXIT_MIN_MBPS} Mbps. The whole pool may be degraded, or SERVER_COUNTRIES may be too narrow."
          return 1
        }

        # Settle first. gluetun's startup check thrashes through several servers
        # in the seconds after a tunnel comes up (measured: 4 servers in 2s), and
        # probing mid-thrash would measure the churn rather than the server.
        echo "gluetun-exit-rotator: waiting 90s for the tunnel to settle before first probe"
        sleep 90
        ensure_fast
        while true; do
          sleep "$$GLUETUN_EXIT_ROTATE_INTERVAL_SECONDS"
          echo "gluetun-exit-rotator: scheduled check (interval $${GLUETUN_EXIT_ROTATE_INTERVAL_SECONDS}s)"
          ensure_fast
        done
volumes:
  tailscale-state:
  tailscale-exit-state:
  gluetun-exit-config:

# arr-core is created by docker-compose.arr-stack.yml. This is the one place
# this file couples to another compose project — accepted so gluetun-exit gets
# a static IP that uptime-kuma can poll at
# http://172.20.0.18:8000/v1/publicip/ip as a standing "is the exit node still
# on a Proton IP" monitor. It does mean gluetun-exit needs arr-stack to have
# been brought up first (boot-compose-up.sh already does that ordering).
#
# Verified live on the NAS 2026-08-21 that this does NOT put the existing
# host-network `tailscale` service at risk: compose only resolves an external
# network for services that actually reference it. With the network deliberately
# missing, `up --dry-run` of a network_mode: host service still reached
# "Container Created", while a service listing that network failed with
# "declared as external, but could not be found". So a missing/renamed arr-core
# can block gluetun-exit, but can never stop the tunnel this file exists to run.
networks:
  arr-core:
    external: true
