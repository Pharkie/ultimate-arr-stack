
#####################################################################
# ⚠️  NEVER use 'docker compose down' - kills Pi-hole DNS!        #
# ⚠️  You WILL lose internet before you can run 'up -d'           #
#                                                                   #
# ✅ Safe restart: docker compose -f docker-compose.arr-stack.yml up -d --force-recreate
# ✅ Or use:       ./scripts/restart-stack.sh                      #
#####################################################################

# Own compose project name so operations on other files (utilities,
# magnetio, traefik) can't accidentally take out this stack via
# --remove-orphans - see docker-compose.tailscale.yml for the original
# precedent for this pattern.
name: arr-core

#########################
# Centralized Volumes   #
#########################
# Explicit `name:` on every volume below pins it to its original physical
# name (arr-stack_<volume>, from before this file had its own project name).
# Without this, an unnamed volume is scoped by project name - renaming the
# project (as this file's `name: arr-core` above does) would silently make
# Compose create a brand-new EMPTY volume instead of reusing the real one,
# which is exactly what happened here in production before this fix (all 12
# volumes below got orphaned into arr-core_* empties on the first recreate
# after adding `name: arr-core` - caught via Jellyfin's StartupWizardCompleted
# flipping back to false).
volumes:
  gluetun-config:
    name: arr-stack_gluetun-config
  qbittorrent-config:
    name: arr-stack_qbittorrent-config
  sabnzbd-config:
    name: arr-stack_sabnzbd-config
  sonarr-config:
    name: arr-stack_sonarr-config
  prowlarr-config:
    name: arr-stack_prowlarr-config
  radarr-config:
    name: arr-stack_radarr-config
  jellyfin-config:
    name: arr-stack_jellyfin-config
  jellyfin-cache:
    name: arr-stack_jellyfin-cache
  seerr-config:
    name: arr-stack_seerr-config
  bazarr-config:
    name: arr-stack_bazarr-config
  decypharr-config:
    name: arr-stack_decypharr-config
  dnscrypt-config:
    name: arr-stack_dnscrypt-config
  pihole-etc-pihole:
    name: arr-stack_pihole-etc-pihole

#########################
# Networks              #
#########################
networks:
  vpn-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.8.1.0/24
  # Renamed from `arr-stack` -> `arr-core` (label only - same CIDR/ip_range/
  # gateway, no renumbering) as part of the trust-tier network segmentation:
  # this is now the "everything except Magnetio" bridge. Verified live on the
  # NAS before this rename that no other project (e.g. a Baserow/therapy-stack
  # coupling CLAUDE.md previously described) actually attaches to this network
  # by name - no such container, static IP, or directory exists on the NAS.
  arr-core:
    name: arr-core
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
          ip_range: 172.20.0.128/25
          gateway: 172.20.0.1
  # Owned by docker-compose.magnetio.yml (magnetio project) - referenced here
  # only so gluetun can join it. magnetio-addon shares gluetun's network
  # namespace (network_mode: container:gluetun) and needs to reach
  # magnetio-scraper/magnetio-redis, which live on this dedicated network
  # instead of arr-core (highest supply-chain/P2P-risk tier - isolated so
  # Sonarr/Radarr/Jellyfin/etc. can't reach it directly). Deploy order:
  # docker-compose.magnetio.yml (creates magnetio-net) before recreating
  # gluetun here, or gluetun's recreate will fail with "network not found".
  magnetio-net:
    external: true

#########################
# Logging               #
#########################
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

#########################
# Security Defaults     #
#########################
x-security: &default-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# LinuxServer.io images use s6-overlay which needs CHOWN/SETUID/SETGID/DAC_OVERRIDE
# to switch users during init. Extend default-security with these caps.
x-security-lsio: &lsio-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - SETUID
    - SETGID
    - DAC_OVERRIDE

#########################
# Services              #
#########################
services:
  # ═══════════════════════════════════════════════════════════════════════════
  # GLUETUN - VPN gateway. Routes download traffic through your VPN provider.
  # All services below marked "via VPN" share this network for privacy.
  # ═══════════════════════════════════════════════════════════════════════════
  gluetun:
    image: qmcgaw/gluetun:v3.41
    container_name: gluetun
    <<: *default-security
    depends_on:
      pihole:
        condition: service_healthy  # Wait for Pi-hole DNS before VPN connects
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - gluetun-config:/gluetun
    environment:
      # VPN Configuration - see .env.example for provider-specific setup
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - SERVER_COUNTRIES=${VPN_COUNTRIES}
      - TZ=${TZ}
      - DNS_ADDRESS=172.20.0.5
      - FIREWALL_OUTBOUND_SUBNETS=${LAN_SUBNET},172.20.0.0/24,10.8.1.0/24
    ports:
      # Ports for services using network_mode: "service:gluetun"
      # Enables direct local access without Traefik (http://NAS_IP:PORT)
      # NOTE: Sonarr (8989) & Radarr (7878) now run on the arr-core bridge
      # (their own static IPs) and publish their own ports — see those services.
      - "9696:9696"   # Prowlarr
      - "8085:8085"   # qBittorrent
      - "8082:8080"   # SABnzbd
      - "8191:8191"   # FlareSolverr
      - "7000:7000"   # Magnetio addon (docker-compose.magnetio.yml, network_mode: container:gluetun)
    networks:
      arr-core:
        ipv4_address: 172.20.0.3
      vpn-net:
      # So magnetio-addon (shares this container's netns) can reach
      # magnetio-scraper/magnetio-redis on their isolated network - see the
      # magnetio-net comment in the networks: block above.
      magnetio-net:
        ipv4_address: 172.22.0.4
    # gluetun's own DNS_SERVER (DNS_ADDRESS=172.20.0.5, DoT to Cloudflare -
    # deliberate VPN leak protection) can't resolve Docker container names,
    # only public hostnames. magnetio-addon shares this netns entirely
    # (network_mode: container:gluetun in docker-compose.magnetio.yml) and
    # needs to reach magnetio-redis/magnetio-scraper by name - confirmed
    # broken live ("getaddrinfo ENOTFOUND magnetio-redis") since nothing had
    # exercised a real stream request before. /etc/hosts entries are checked
    # before DNS, so this fixes resolution without touching DNS_ADDRESS and
    # weakening leak protection for gluetun's other dependents. IPs must
    # match magnetio-redis/magnetio-scraper's static ipv4_address in
    # docker-compose.magnetio.yml.
    extra_hosts:
      - "magnetio-redis:172.22.0.3"
      - "magnetio-scraper:172.22.0.2"
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s  # Give VPN time to establish connection

  # ═══════════════════════════════════════════════════════════════════════════
  # QBITTORRENT - Torrent download client. Downloads files through VPN.
  # Access: qbit.lan | qbit.yourdomain.com | NAS_IP:8085
  # ═══════════════════════════════════════════════════════════════════════════
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.1.4
    container_name: qbittorrent
    <<: *lsio-security
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8085
      - DOCKER_MODS=ghcr.io/vuetorrent/vuetorrent-lsio-mod:latest
    volumes:
      - qbittorrent-config:/config
      - ${MEDIA_ROOT}:/data
    labels:
      - deunhealth.restart.on.unhealthy=true
      - gluetun.dependent=true  # gluetun-recover restarts this if SIGKILLed by a gluetun restart
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085/ && wget -q --spider --timeout=5 http://www.google.com"]
      interval: 2m
      timeout: 15s
      retries: 4
      start_period: 60s

  # ═══════════════════════════════════════════════════════════════════════════
  # SABNZBD - Usenet download client. Downloads via VPN for extra security.
  # Access: sabnzbd.lan | sabnzbd.yourdomain.com | NAS_IP:8082
  # ═══════════════════════════════════════════════════════════════════════════
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:5.1.0-ls266
    container_name: sabnzbd
    <<: *lsio-security
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - sabnzbd-config:/config
      - ${MEDIA_ROOT}:/data
    labels:
      - deunhealth.restart.on.unhealthy=true
      - gluetun.dependent=true  # gluetun-recover restarts this if SIGKILLed by a gluetun restart
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ && wget -q --spider --timeout=5 http://www.google.com"]
      interval: 3m
      timeout: 15s
      retries: 4
      start_period: 60s

  # ═══════════════════════════════════════════════════════════════════════════
  # SONARR - TV show monitor. Watches for new episodes and sends to download.
  # Access: sonarr.lan | sonarr.yourdomain.com | NAS_IP:8989
  # Runs on the arr-core bridge (own IP 172.20.0.10), NOT behind the VPN:
  # Sonarr only talks to metadata providers (TVDB/TMDB) + internal services,
  # never to indexers/peers, so it needs no VPN. Staying on the bridge means a
  # gluetun/VPN reconnect no longer cuts Sonarr off from Jellyseerr/Bazarr.
  # It reaches the VPN-side download clients via the `gluetun` hostname.
  # ═══════════════════════════════════════════════════════════════════════════
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19
    container_name: sonarr
    <<: *lsio-security
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - SONARR__AUTH__APIKEY=${SONARR_API_KEY}
    ports:
      - "8989:8989"   # Direct local access (http://NAS_IP:8989)
    networks:
      arr-core:
        ipv4_address: 172.20.0.10
    volumes:
      - sonarr-config:/config
      - ${MEDIA_ROOT}:/data
    labels:
      - deunhealth.restart.on.unhealthy=true
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8989/"]
      interval: 2m
      timeout: 15s
      retries: 3
      start_period: 60s

  # ═══════════════════════════════════════════════════════════════════════════
  # PROWLARR - Indexer manager. Finds download sources for Sonarr/Radarr.
  # Access: prowlarr.lan | prowlarr.yourdomain.com | NAS_IP:9696
  # ═══════════════════════════════════════════════════════════════════════════
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.5.2
    container_name: prowlarr
    <<: *lsio-security
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - PROWLARR__AUTH__APIKEY=${PROWLARR_API_KEY}
    volumes:
      - prowlarr-config:/config
    labels:
      - deunhealth.restart.on.unhealthy=true
      - gluetun.dependent=true  # gluetun-recover restarts this if SIGKILLed by a gluetun restart
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9696/"]
      interval: 2m
      timeout: 15s
      retries: 3
      start_period: 60s

  # ═══════════════════════════════════════════════════════════════════════════
  # RADARR - Movie monitor. Watches for new movies and sends to download.
  # Access: radarr.lan | radarr.yourdomain.com | NAS_IP:7878
  # Runs on the arr-core bridge (own IP 172.20.0.11), NOT behind the VPN —
  # same rationale as Sonarr above. Reaches VPN-side download clients via the
  # `gluetun` hostname.
  # ═══════════════════════════════════════════════════════════════════════════
  radarr:
    image: lscr.io/linuxserver/radarr:6.3.0
    container_name: radarr
    <<: *lsio-security
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - RADARR__AUTH__APIKEY=${RADARR_API_KEY}
    ports:
      - "7878:7878"   # Direct local access (http://NAS_IP:7878)
    networks:
      arr-core:
        ipv4_address: 172.20.0.11
    volumes:
      - radarr-config:/config
      - ${MEDIA_ROOT}:/data
    labels:
      - deunhealth.restart.on.unhealthy=true
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7878/"]
      interval: 2m
      timeout: 15s
      retries: 3
      start_period: 60s

  # ═══════════════════════════════════════════════════════════════════════════
  # JELLYFIN - Media server. Stream your movies and TV shows like Netflix.
  # Access: jellyfin.lan | jellyfin.yourdomain.com | NAS_IP:8096
  # ═══════════════════════════════════════════════════════════════════════════
  jellyfin:
    image: jellyfin/jellyfin:10.11
    container_name: jellyfin
    <<: *default-security
    cap_add:
      - CHOWN           # Create config/cache subdirs on first run
      - DAC_OVERRIDE    # Write to root-owned volume directories
    ports:
      - "8096:8096"     # Web UI
      - "7359:7359/udp" # Client discovery (auto-detect on LAN)
      - "1900:1900/udp" # DLNA
    environment:
      - TZ=${TZ}
    # Hardware transcoding: DH4300 Plus is Rockchip RK3588C, not Intel, so Quick
    # Sync (/dev/dri + render group) does not apply here.
    #
    # RK3588 RKMPP hw transcoding (Jellyfin 10.9+) via the Rockchip BSP kernel's
    # VPU. Confirmed present on this NAS (kernel 6.1.84, all device nodes exist):
    #   /dev/dri/{card0,card1,renderD128,renderD129} /dev/dma_heap/{cma,system}
    #   /dev/mali0 /dev/rga /dev/mpp_service
    # After the stack is up, enable RKMPP in Jellyfin dashboard > Playback and
    # uncheck any codecs the RK3588 doesn't support.
    security_opt:
      - no-new-privileges:true
      - apparmor:unconfined
      - systempaths=unconfined
    devices:
      - /dev/dri:/dev/dri
      - /dev/dma_heap:/dev/dma_heap
      - /dev/mali0:/dev/mali0
      - /dev/rga:/dev/rga
      - /dev/mpp_service:/dev/mpp_service
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - ${MEDIA_ROOT}/media:/data/media:ro
    networks:
      arr-core:
        ipv4_address: 172.20.0.4
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 1m
      timeout: 30s
      retries: 2
      start_period: 30s

# ═══════════════════════════════════════════════════════════════════════════
  # DNSCRYPT-PROXY - DNS over HTTPS/DNSCrypt proxy. Encrypts DNS queries.
  # No web UI. Used internally by Pi-hole at 172.20.0.6:5053
  # Protocols: DoH (DNS over HTTPS), DNSCrypt, Anonymized DNS
  # ═══════════════════════════════════════════════════════════════════════════
  dnscrypt-proxy:
    image: klutchell/dnscrypt-proxy:2.1.16
    container_name: dnscrypt-proxy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      arr-core:
        ipv4_address: 172.20.0.6
    volumes:
      - dnscrypt-config:/config
    environment:
      - TZ=${TZ}
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD", "/usr/local/bin/dnsprobe", "google.com", "127.0.0.1:5053"]
      interval: 30s
      timeout: 10s
      retries: 2
      start_period: 30s

  # ═══════════════════════════════════════════════════════════════════════════
  # PI-HOLE - DNS server. Enables .lan domains and blocks ads network-wide.
  # Access: pihole.lan/admin | NAS_IP:8081/admin
  # For: Home Pro + Anywhere setups
  # Configure upstream DNS: Settings → DNS → Custom = 172.20.0.6#5053
  # ═══════════════════════════════════════════════════════════════════════════
  pihole:
    image: pihole/pihole:2026.07.2
    container_name: pihole
    depends_on:
      dnscrypt-proxy:
        condition: service_healthy
    ports:
      - "${NAS_IP}:53:53/tcp"  # Bind to NAS IP (not 0.0.0.0) to avoid conflict with host dnsmasq on 127.0.0.1:53
      - "${NAS_IP}:53:53/udp"  # NAS_IP MUST be a static IP — DHCP IPs aren't ready at boot, causing exit 128
      - "8081:80"  # Web UI (local network access)
    networks:
      arr-core:
        ipv4_address: 172.20.0.5
    environment:
      - TZ=${TZ}
      - FTLCONF_webserver_api_password=${PIHOLE_UI_PASS}
      - FTLCONF_dns_listeningMode=all
      - FTLCONF_misc_etc_dnsmasq_d=true
    volumes:
      - pihole-etc-pihole:/etc/pihole
      - ./pihole/dnsmasq.d:/etc/dnsmasq.d
    security_opt:
      - no-new-privileges:false  # Pi-hole FTL needs setcap to apply capabilities
    cap_drop:
      - ALL
    cap_add:
      - CHOWN           # File ownership during startup
      - NET_ADMIN       # DNS server binding
      - NET_RAW         # Raw socket access for DHCP/DNS
      - SYS_NICE        # Priority scheduling for FTL
      - SETUID          # Drop privileges after startup
      - SETGID          # Drop privileges after startup
      - SETFCAP         # Apply capabilities to FTL binary
      - DAC_OVERRIDE    # Access config files during startup
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD", "dig", "@127.0.0.1", "-p", "53", "google.com", "+short"]
      interval: 30s
      timeout: 10s
      retries: 2
      start_period: 30s

  # ═══════════════════════════════════════════════════════════════════════════
  # SEERR (formerly Jellyseerr) - Request portal. Users request movies/shows here.
  # Access: seerr.lan | seerr.yourdomain.com | NAS_IP:5055
  # ═══════════════════════════════════════════════════════════════════════════
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.4.1
    init: true
    container_name: seerr
    <<: *default-security
    cap_add:
      - CHOWN           # Create config subdirs on first run
      - DAC_OVERRIDE    # Write to root-owned volume directories
    depends_on:
      gluetun:
        condition: service_healthy  # Needs gluetun to reach Sonarr/Radarr
        restart: true
    ports:
      - "5055:5055"
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
      - PORT=5055
    networks:
      arr-core:
        ipv4_address: 172.20.0.8
    volumes:
      - seerr-config:/app/config
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5055/api/v1/status"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 20s

  # ═══════════════════════════════════════════════════════════════════════════
  # BAZARR - Subtitle manager. Automatically downloads subtitles.
  # Access: bazarr.lan | bazarr.yourdomain.com | NAS_IP:6767
  # ═══════════════════════════════════════════════════════════════════════════
  bazarr:
    image: lscr.io/linuxserver/bazarr:1.6.0
    container_name: bazarr
    <<: *lsio-security
    depends_on:
      gluetun:
        condition: service_healthy  # Needs gluetun to reach Sonarr/Radarr
        restart: true
    ports:
      - "6767:6767"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    networks:
      arr-core:
        ipv4_address: 172.20.0.9
    volumes:
      - bazarr-config:/config
      - ${MEDIA_ROOT}/media:/data/media
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6767/"]
      interval: 3m
      timeout: 10s
      retries: 2
      start_period: 60s

  # ═══════════════════════════════════════════════════════════════════════════
  # DECYPHARR - TorBox debrid download client. Presents a qBittorrent-compatible
  # API so Sonarr/Radarr can add it as a second download client alongside the
  # real qBittorrent. Downloads finished files straight to /data/torbox from
  # TorBox's servers over HTTPS - no torrent swarm traffic from this NAS, so
  # unlike qBittorrent/SABnzbd/Prowlarr it does NOT need the VPN (same reasoning
  # as the Sonarr/Radarr off-VPN migration, see docs/MIGRATION-arr-off-vpn.md).
  # ═══════════════════════════════════════════════════════════════════════════
  decypharr:
    image: ghcr.io/sirrobot01/decypharr:v2.5
    container_name: decypharr
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    ports:
      - "8282:8282"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    networks:
      arr-core:
        ipv4_address: 172.20.0.7
    volumes:
      - decypharr-config:/app
      - ${MEDIA_ROOT}:/data
    labels:
      - deunhealth.restart.on.unhealthy=true
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8282/"]
      interval: 2m
      timeout: 15s
      retries: 3
      start_period: 60s

  # ═══════════════════════════════════════════════════════════════════════════
  # FLARESOLVERR - Cloudflare bypass. Helps Prowlarr access protected sites.
  # Runs behind Gluetun VPN so solved cookies match Prowlarr's exit IP.
  # No web UI. Used internally by Prowlarr at localhost:8191
  # ═══════════════════════════════════════════════════════════════════════════
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.4.6
    container_name: flaresolverr
    <<: *default-security
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    labels:
      - deunhealth.restart.on.unhealthy=true
      - gluetun.dependent=true  # gluetun-recover restarts this if SIGKILLed by a gluetun restart
    restart: always
    logging: *default-logging
    healthcheck:
      # Actually test Chrome by making a solve request (catches Chrome crashes)
      test: ["CMD", "curl", "-sf", "-X", "POST", "-H", "Content-Type: application/json",
             "-d", "{\"cmd\":\"request.get\",\"url\":\"http://localhost:8191/\",\"maxTimeout\":30000}",
             "http://localhost:8191/v1"]
      interval: 10m
      timeout: 60s
      retries: 2
      start_period: 60s

  # ═══════════════════════════════════════════════════════════════════════════
  # VPN-SOCKS5 - SOCKS5 proxy tunneled through Gluetun's ProtonVPN connection
  # (network_mode: service:gluetun, same pattern as qBittorrent/SABnzbd/
  # Prowlarr/FlareSolverr above). Lets other containers on the arr-core
  # network route traffic through the VPN without joining Gluetun's network
  # namespace directly — used by Magnetio's P2P Privacy Proxy setting so
  # uncached torrent connections exit via ProtonVPN instead of the NAS's own
  # WAN IP. Internal-only, reachable at gluetun:1080 from other containers on
  # the arr-core network (no host port published).
  # ═══════════════════════════════════════════════════════════════════════════
  vpn-socks5:
    image: serjs/go-socks5-proxy:v0.0.4
    container_name: vpn-socks5
    <<: *default-security
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      - PROXY_USER=${VPN_SOCKS5_USER}
      - PROXY_PASSWORD=${VPN_SOCKS5_PASSWORD}
      - PROXY_PORT=1080
    labels:
      - deunhealth.restart.on.unhealthy=true
      - gluetun.dependent=true  # gluetun-recover restarts this if SIGKILLed by a gluetun restart
    restart: always
    logging: *default-logging

  # ═══════════════════════════════════════════════════════════════════════════
  # STREMIO-JELLYFIN - Stremio addon that exposes this Jellyfin library as a
  # Stremio stream source, so Stremio can play anything already cached locally
  # before falling back to Magnetio's torrent/debrid streams.
  # Install in Stremio: http://NAS_IP:60421/manifest.json
  # ═══════════════════════════════════════════════════════════════════════════
  stremio-jellyfin:
    # No published arm64 image upstream (amd64-only, fails with "exec format
    # error" on this NAS's RK3588) — built from source instead. Source lives
    # in ./stremio-jellyfin on the NAS, synced from
    # https://github.com/akarazniewicz/stremio-jellyfin (with a local fix:
    # the upstream Dockerfile's ENTRYPOINT calls "nodejs", which doesn't
    # exist in the node:21-slim base image — only "node" does).
    build:
      context: ./stremio-jellyfin
      dockerfile: Dockerfile
    image: stremio-jellyfin:local
    container_name: stremio-jellyfin
    <<: *default-security
    depends_on:
      jellyfin:
        condition: service_healthy
    ports:
      - "60421:60421"
    environment:
      # LAN address, not the internal Docker hostname — this addon embeds
      # this value directly into poster/stream URLs it hands back to Stremio
      # clients on your phone/laptop, which can't resolve "jellyfin" as a
      # hostname the way containers on the arr-core network can.
      - JELLYFIN_SERVER=http://${NAS_IP}:8096
      - JELLYFIN_USER=${STREMIO_JELLYFIN_USER}
      - JELLYFIN_PASSWORD=${STREMIO_JELLYFIN_PASSWORD}
    networks:
      arr-core:
        ipv4_address: 172.20.0.17
    restart: always
    logging: *default-logging
    healthcheck:
      # node:21-slim has no curl/wget — use node's built-in http client instead
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:60421/manifest.json', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 20s

