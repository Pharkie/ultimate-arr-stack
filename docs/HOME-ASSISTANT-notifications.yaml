# Arr-stack notifications: ONE Home Assistant automation, ONE webhook, every sender.
# Paste into automations.yaml (or Settings → Automations → ⋮ → Edit in YAML),
# then change the two CHANGE-ME values. See docs/HOME-ASSISTANT.md.
#
# Two body shapes arrive and are normalised into one notice (title, message,
# optional link, level):
#   1. GENERIC  {"title", "message", "level"?, "url"?, "tag"?}: the stack's own
#      scripts (backup failure = critical, weekly queue-cleanup report = info,
#      or warning when downloads still wait for a manual import), Uptime Kuma's
#      custom webhook body and Beszel's JSON template.
#      Any new sender should use this shape. The same `tag` replaces a notice.
#   2. ARR      Sonarr/Radarr's webhook (`eventType` + `series`/`episodes` or
#      `movie`). Health and ManualInteractionRequired are `warning`, the rest `info`.
#   Anything else still produces a `warning` saying it wasn't recognised.
#
# Levels: info = notification panel only; warning (default) = panel + push;
#         critical = the same as warning (a normal push respects Focus modes).
#
# Senders MUST send `Content-Type: application/json`: Home Assistant parses a
# webhook body as JSON only when the header says so.
#
# A VPN outage is ONE notice. While Uptime Kuma's "VPN Check" is down, the
# notices that only follow from it (the Kuma monitors of the services inside
# gluetun, Sonarr/Radarr's indexer and download-client health checks, the
# stuck-request report) are listed in the VPN Check notice instead of getting
# their own notice or push, and their recoveries take them out again. It needs
# the sensor in HOME-ASSISTANT-vpn-fold.yaml; without it, everything posts as
# before. See docs/HOME-ASSISTANT.md.
#
# Generated with LLM assistance and human-reviewed, and tested end to end
# against Sonarr 4, Radarr 6 and the stack's scripts. Read it
# before you use it.

- id: arr_stack_notifications
  alias: Arr stack notifications
  description: Every arr-stack sender (Sonarr, Radarr, Uptime Kuma, Beszel, the
    stack's own scripts) posts to one webhook; one notice in the HA panel, and a phone push
    for warning/critical.
  triggers:
  # Every sender posts from the NAS straight to http://<HA LAN IP>:8123, never
  # through Nabu Casa or a reverse proxy, so local_only costs nothing and keeps
  # the webhook off the internet. Use an ID nobody could guess.
  - trigger: webhook
    webhook_id: arr-stack-notify-CHANGE-ME
    allowed_methods:
    - POST
    local_only: true
  actions:
  - variables:
      j: '{{ trigger.json if trigger.json is defined and trigger.json is mapping
        else {} }}'
      # Order matters only in theory: no generic body carries `eventType`.
      kind: >-
        {%- if j.eventType is defined -%}arr
        {%- elif j.title is defined or j.message is defined -%}generic
        {%- else -%}unknown
        {%- endif -%}
      # ---- Sonarr/Radarr helpers. Empty for every other kind. -------------
      # Field names are from REAL payloads in the traces, not the docs: Sonarr
      # v4 sends `episodeFiles` (a list) where the docs say `episodeFile`, and
      # leaves `isUpgrade` out entirely unless it is true. Both are handled.
      app: >-
        {%- if kind == 'arr' -%}
          {{- j.get('instanceName') or ('Sonarr' if j.get('series') else 'Radarr' if j.get('movie') else 'Sonarr/Radarr') -}}
        {%- endif -%}
      # S01E02; S01E02–E04 for a multi-episode file; S01E10–S02E01 across seasons.
      ep_code: >-
        {%- set e = j.get('episodes') if kind == 'arr' else none -%}
        {%- set eps = (e if e is sequence and e is not string and e is not mapping else [])
              | select('mapping') | sort(attribute='seasonNumber,episodeNumber') | list -%}
        {%- if eps -%}
          {%- set a = eps | first -%}{%- set b = eps | last -%}
          {{- 'S%02dE%02d' | format(a.get('seasonNumber') | int(0), a.get('episodeNumber') | int(0)) -}}
          {%- if eps | count > 1 and b.get('seasonNumber') == a.get('seasonNumber') -%}
            {{- '–E%02d' | format(b.get('episodeNumber') | int(0)) -}}
          {%- elif eps | count > 1 -%}
            {{- '–S%02dE%02d' | format(b.get('seasonNumber') | int(0), b.get('episodeNumber') | int(0)) -}}
          {%- endif -%}
        {%- endif -%}
      # The episode's own title, only when the file is ONE episode.
      ep_title: >-
        {%- set e = j.get('episodes') if kind == 'arr' else none -%}
        {%- if e is sequence and e is not string and e | count == 1 and e[0] is mapping -%}
          {{- e[0].get('title') or '' -}}
        {%- endif -%}
      # "Movie (2026)" or "Series S01E02" — what a manual-import title names.
      media_short: >-
        {%- set m = j.get('movie') if kind == 'arr' else none -%}
        {%- set sr = j.get('series') if kind == 'arr' else none -%}
        {%- if m is mapping and m.get('title') -%}
          {{- m.get('title') ~ ((' (' ~ m.get('year') ~ ')') if m.get('year') | int(0) > 0 else '') -}}
        {%- elif sr is mapping and sr.get('title') -%}
          {{- sr.get('title') ~ ((' ' ~ ep_code) if ep_code else '') -}}
        {%- endif -%}
      # ...plus " – Episode title" for a single episode.
      media: >-
        {%- if media_short -%}
          {{- media_short ~ ((' – ' ~ ep_title) if ep_title and j.get('series') else '') -}}
        {%- endif -%}
      # The release name, for the rare body that names no movie or series.
      release_title: >-
        {%- if kind == 'arr' -%}
          {%- set di = j.get('downloadInfo') if j.get('downloadInfo') is mapping else {} -%}
          {%- set rl = j.get('release') if j.get('release') is mapping else {} -%}
          {{- di.get('title') or rl.get('releaseTitle') or '' -}}
        {%- endif -%}
      # First quality found, most specific first: the imported file, then the
      # release, then the queue item.
      quality: >-
        {%- if kind == 'arr' -%}
          {%- set ef = j.get('episodeFiles') -%}
          {%- set c = [
                j.get('movieFile').get('quality') if j.get('movieFile') is mapping else none,
                j.get('episodeFile').get('quality') if j.get('episodeFile') is mapping else none,
                ef[0].get('quality') if ef is sequence and ef is not string and ef | count > 0 and ef[0] is mapping else none,
                j.get('release').get('quality') if j.get('release') is mapping else none,
                j.get('downloadInfo').get('quality') if j.get('downloadInfo') is mapping else none] -%}
          {{- c | select('string') | reject('eq', '') | first | default('') -}}
        {%- endif -%}
      # The first non-empty downloadStatusMessages[].messages[] entry, one line,
      # at most 200 characters, trailing full stop dropped (the sentence it is
      # spliced into supplies one).
      status_message: >-
        {%- set ns = namespace(m='') -%}
        {%- set sms = j.get('downloadStatusMessages') if kind == 'arr' else none -%}
        {%- for sm in (sms if sms is sequence and sms is not string else []) if sm is mapping -%}
          {%- set ms = sm.get('messages') -%}
          {%- for x in (ms if ms is sequence and ms is not string else []) if x is string and x | trim and not ns.m -%}
            {%- set ns.m = x | trim -%}
          {%- endfor -%}
        {%- endfor -%}
        {%- set t = ns.m | regex_replace('\\s+', ' ') -%}
        {%- set t = (t[:200] ~ '…') if t | length > 200 else t -%}
        {{- t.rstrip('.') -}}
      # Every notice says what happened and, where there is one, what to do.
      title: >-
        {%- set ev = j.get('eventType') -%}
        {%- if kind == 'arr' -%}
          {%- if ev == 'Test' -%}{{ app }}: test notification
          {%- elif ev == 'Download' -%}{{ 'Upgraded: ' if j.get('isUpgrade') else 'Ready to watch: ' }}{{ media or release_title or app ~ ' download' }}
          {%- elif ev == 'Grab' -%}Downloading: {{ media or release_title or 'a release' }}
          {%- elif ev == 'ManualInteractionRequired' -%}Needs manual import: {{ media_short or release_title or 'a download' }}
          {%- elif ev == 'Health' -%}{{ app }} needs attention
          {%- elif ev == 'HealthRestored' -%}{{ app }} is healthy again
          {%- elif ev == 'ApplicationUpdate' -%}{{ app }} updated to {{ j.get('newVersion') or 'a new version' }}
          {%- else -%}{{ app }}: {{ ev }}
          {%- endif -%}
        {%- elif kind == 'generic' -%}{{ j.title | default('Arr stack', true) }}
        {%- else -%}Arr stack: unrecognised notification
        {%- endif -%}
      message: >-
        {%- set ev = j.get('eventType') -%}
        {%- set q = (' (' ~ quality ~ ')') if quality else '' -%}
        {%- if kind == 'arr' -%}
          {%- if ev == 'Test' -%}{{ app }} can reach Home Assistant. Nothing to do.
          {%- elif ev == 'Download' and j.get('isUpgrade') -%}Replaced with a better copy{{ q }}.
          {%- elif ev == 'Download' -%}Downloaded and imported{{ q }}.
          {%- elif ev == 'Grab' -%}Sent to {{ j.get('downloadClient') or 'the download client' }}{{ q }}. Nothing to do yet.
          {%- elif ev == 'ManualInteractionRequired' -%}{{ app }} downloaded it but won't import it on its own{{ (': ' ~ status_message) if status_message else '' }}. Open {{ app }} → Activity → Queue and import it.
          {%- elif ev == 'Health' -%}{{ j.get('message') or 'A health check failed.' }}
          {%- elif ev == 'HealthRestored' -%}Resolved: {{ j.get('message') or 'the failing health check now passes.' }}
          {%- elif ev == 'ApplicationUpdate' -%}Updated from {{ j.get('previousVersion') or 'the previous version' }}. Nothing to do.
          {%- else -%}{{ media or release_title or j.get('message') or 'No details in the payload.' }}
          {%- endif -%}
        {%- elif kind == 'generic' -%}{{ j.message | default('(no message)', true) }}
        {%- elif trigger.json is defined -%}Body not in any known shape: {{ (trigger.json | tojson)[:600] }}
        {%- else -%}No JSON body. The sender must send Content-Type: application/json.
        {%- endif -%}
      level: >-
        {%- if kind == 'arr' -%}{{ 'warning' if j.get('eventType') in ['Health', 'ManualInteractionRequired'] else 'info' }}
        {%- elif kind == 'generic' -%}
          {%- set l = j.level | default('warning', true) | string | lower -%}
          {{- l if l in ['info', 'warning', 'critical'] else 'warning' -}}
        {%- else -%}warning
        {%- endif -%}
      # Only an http(s) URL becomes a link: an empty `url` is not something to
      # hand the companion app.
      link: >-
        {%- if kind == 'generic' -%}{% set u = j.url | default('') %}
        {%- elif kind == 'arr' and j.eventType in ['Health', 'HealthRestored'] -%}{% set u = j.wikiUrl | default('') %}
        {%- else -%}{% set u = '' %}
        {%- endif -%}
        {{- u if u is string and u.startswith('http') else '' -}}
      # The panel's notification_id AND the push `tag`: the same tag replaces
      # the earlier notice in both places. A Sonarr/Radarr health check per
      # check, so HealthRestored replaces its own warning;
      # a generic sender only if it asks. Everything else is unique and stacks,
      # which is what the old arr automation did.
      tag: >-
        {%- if kind == 'arr' and j.eventType in ['Health', 'HealthRestored'] -%}arr_{{ (j.instanceName | default('arr', true) ~ '_health_' ~ j.type | default('')) | slugify }}
        {%- elif kind == 'generic' and j.tag | default('', true) -%}arrstack_{{ j.tag | string | slugify }}
        {%- else -%}arrstack_{{ context.id | lower }}
        {%- endif -%}
      panel_message: >-
        {{- message -}}
        {%- if link -%}{{ '\n\n' }}[Open link]({{ link }}){%- endif -%}
      # APNs caps the whole payload at 4 KB; a weekly report can be longer.
      # `| string` because HA parses rendered variables: a bare "42" is an int.
      push_message: >-
        {%- set m = message | string -%}
        {{- m if m | length <= 900 else m[:900] ~ ' …' -}}
      push_data: >-
        {%- set d = {'tag': tag, 'push': {'thread-id': 'arr-stack-' ~ kind}} -%}
        {{ dict(d, url=link) if link else d }}
      # ---- The VPN fold. ---------------------------------------------------
      # Kuma names its notices "<monitor> is down" / "<monitor> is back up".
      vpn_name: VPN Check
      # Kuma monitors of services inside gluetun's network namespace.
      behind_vpn: [qBittorrent, Prowlarr, SABnzbd, FlareSolverr]
      # Sonarr/Radarr health checks that fail whenever the indexers or the
      # download client are unreachable. `type` in the payload, lower-cased.
      vpn_checks: [indexerstatuscheck, indexerlongtermstatuscheck, indexerrsscheck,
        indexersearchcheck, downloadclientcheck, downloadclientstatuscheck]
      # Generic senders' tags whose notice only restates the outage and has no
      # recovery of its own: the daily stuck-request report runs again tomorrow.
      vpn_reports: [stuck-requests]
      role: >-
        {%- set ev = j.get('eventType') -%}
        {%- set t = title if kind == 'generic' else '' -%}
        {%- set check = (j.get('type') or '') | string | lower -%}
        {%- if t == vpn_name ~ ' is down' -%}vpn_down
        {%- elif t == vpn_name ~ ' is back up' -%}vpn_up
        {%- elif t.endswith(' is down') and t[:-8] in behind_vpn -%}problem
        {%- elif t.endswith(' is back up') and t[:-11] in behind_vpn -%}recovery
        {%- elif kind == 'generic' and (j.tag | default('', true) | string) in vpn_reports -%}report
        {%- elif kind == 'arr' and ev == 'Health' and check in vpn_checks -%}problem
        {%- elif kind == 'arr' and ev == 'HealthRestored' and check in vpn_checks -%}recovery
        {%- endif -%}
      fold_ready: "{{ states.sensor.arr_stack_vpn_fold is not none }}"
      fold_state: "{{ states('sensor.arr_stack_vpn_fold') }}"
      fold_rev: "{{ state_attr('sensor.arr_stack_vpn_fold', 'rev') | int(0) }}"
      fold_tag: "{{ state_attr('sensor.arr_stack_vpn_fold', 'vpn_tag') or '' }}"
      fold_message: "{{ state_attr('sensor.arr_stack_vpn_fold', 'message') or '' }}"
      now_ts: "{{ as_timestamp(now()) | int }}"
      held: >-
        {%- set h = state_attr('sensor.arr_stack_vpn_fold', 'held') -%}
        {{- (h if h is sequence and h is not string else []) | select('mapping') | list -}}
      # Follow-on problems posted in the last 30 minutes while the VPN looked
      # fine. Kuma's qBittorrent monitor goes down ~4 min into an outage and
      # VPN Check 5-10 min in, so the first follow-on usually beats the VPN
      # notice; when the VPN notice opens, these are pulled into it.
      recent: >-
        {%- set r = state_attr('sensor.arr_stack_vpn_fold', 'recent') -%}
        {{- (r if r is sequence and r is not string else []) | select('mapping')
              | selectattr('at', 'ge', now_ts - 1800) | list -}}
      # post: a notice of its own, as before. open/close: the VPN Check notice
      # itself. hold/release: folded into it, or taken out of it. A recovery
      # while the VPN is down is released too: whatever it recovers from is
      # either held or out of date.
      fold_action: >-
        {%- if not fold_ready or not role -%}post
        {%- elif role == 'vpn_down' -%}open
        {%- elif role == 'vpn_up' -%}close
        {%- elif role in ['problem', 'report'] and fold_state == 'down' -%}hold
        {%- elif role == 'recovery' and (fold_state == 'down' or tag in (held | map(attribute='tag') | list)) -%}release
        {%- else -%}post
        {%- endif -%}
      # How a held notice reads in the VPN notice: Sonarr's title ("Sonarr
      # needs attention") says nothing, so its health message stands in.
      fold_label: >-
        {%- if kind == 'arr' -%}{{ app }}: {{ (j.get('message') or 'health check failed') | string | truncate(100) }}
        {%- else -%}{{ title }}
        {%- endif -%}
      fold_item: "{{ {'tag': tag, 'label': fold_label, 'recovers': role == 'problem', 'at': now_ts} }}"
      new_held: >-
        {%- set rest = held | rejectattr('tag', 'eq', tag) | list -%}
        {%- if fold_action == 'open' -%}{{ recent }}
        {%- elif fold_action == 'hold' -%}{{ rest + [fold_item] }}
        {%- elif fold_action == 'release' -%}{{ rest }}
        {%- elif fold_action == 'close' -%}{{ held | selectattr('recovers') | list }}
        {%- else -%}{{ held }}
        {%- endif -%}
      new_recent: >-
        {%- set rest = recent | rejectattr('tag', 'eq', tag) | list -%}
        {%- if fold_action == 'open' -%}{{ [] }}
        {%- elif fold_action == 'post' and role == 'problem' -%}{{ rest + [fold_item] }}
        {%- elif fold_action == 'post' and role == 'recovery' -%}{{ rest }}
        {%- else -%}{{ recent }}
        {%- endif -%}
      fold_write: "{{ fold_ready and (fold_action != 'post' or new_recent != recent) }}"
      new_state: >-
        {{- 'down' if fold_action == 'open' else 'up' if fold_action == 'close' else fold_state -}}
      new_tag: "{{ tag if fold_action in ['open', 'close'] else fold_tag }}"
      new_message: "{{ panel_message if fold_action in ['open', 'close'] else fold_message }}"
      vpn_notice_title: "{{ vpn_name }} {{ 'is down' if new_state == 'down' else 'is back up' }}"
      vpn_notice_message: >-
        {%- set labels = new_held | map(attribute='label') | list -%}
        {{- new_message -}}
        {%- if new_state == 'down' and labels -%}
          {{ '\n\n' }}Held here, because they follow from it: {{ labels | join('; ') }}.
        {%- elif new_state == 'down' -%}
          {{ '\n\n' }}Notices that follow from it ({{ behind_vpn | join(', ') }} down; Sonarr and Radarr indexer and download-client warnings; the stuck-request report) are held here until it is back.
        {%- elif labels -%}
          {{ '\n\n' }}Still waiting to recover: {{ labels | join('; ') }}.
        {%- elif held -%}
          {{ '\n\n' }}Nothing held while it was down is still failing.
        {%- endif -%}
  - if: "{{ fold_action == 'post' }}"
    then:
    - action: persistent_notification.create
      data:
        notification_id: '{{ tag }}'
        title: '{{ title }}'
        message: '{{ panel_message }}'
  # A held notice may already be in the panel: posted before the VPN went down,
  # or a "back up" from an earlier flap.
  - if: "{{ fold_action in ['hold', 'release'] }}"
    then:
    - action: persistent_notification.dismiss
      data:
        notification_id: '{{ tag }}'
  - if: "{{ fold_action == 'open' and new_held | count > 0 }}"
    then:
    - repeat:
        for_each: "{{ new_held | map(attribute='tag') | list }}"
        sequence:
        - action: persistent_notification.dismiss
          data:
            notification_id: '{{ repeat.item }}'
  # The sensor takes the whole new state; wait until it shows it, so the next
  # queued run reads this one's write and not the one before.
  - if: "{{ fold_write }}"
    then:
    - event: arr_stack_vpn_fold
      event_data:
        rev: '{{ fold_rev + 1 }}'
        state: '{{ new_state }}'
        vpn_tag: '{{ new_tag }}'
        message: '{{ new_message }}'
        held: '{{ new_held }}'
        recent: '{{ new_recent }}'
    - wait_template: "{{ state_attr('sensor.arr_stack_vpn_fold', 'rev') | int(0) == fold_rev + 1 }}"
      timeout: 5
  - if: "{{ fold_action != 'post' and new_tag != '' }}"
    then:
    - action: persistent_notification.create
      data:
        notification_id: '{{ new_tag }}'
        title: '{{ vpn_notice_title }}'
        message: '{{ vpn_notice_message }}'
  # A push for a notice of its own, and for the VPN notice when it opens; a
  # held notice never pushes, and the VPN notice changing does not push again.
  - if:
    - condition: template
      value_template: "{{ level in ['warning', 'critical'] and fold_action in ['post', 'open'] }}"
    then:
    - action: notify.mobile_app_CHANGE-ME  # your phone's companion-app notify service
      data:
        title: '{{ title }}'
        message: >-
          {%- set m = (vpn_notice_message if fold_action == 'open' else message) | string -%}
          {{- m if m | length <= 900 else m[:900] ~ ' …' -}}
        data: '{{ push_data }}'
  # Several senders share this, and HA keeps only 5 traces by default.
  trace:
    stored_traces: 20
  # Several posts can land in the same second (health alerts from Sonarr and
  # Radarr together, several Kuma monitors); `single` would drop all but the first.
  mode: queued
  max: 25
